// La app de Recibo guarda la fecha como texto ("mar, 05 ago 2026").
// Aqui se maneja ISO ("2026-08-05"). Esta funcion traduce de uno al otro.
function recISO(h){
  var f=(h&&h.fecha)||"";
  var m=String(f).toLowerCase().replace(/[.,]/g," ").match(/(\d{1,2})\s+([a-z]+)\s+(\d{4})/);
  if(m){
    var mo=MES3[m[2].slice(0,3)];
    if(mo)return m[3]+"-"+(mo<10?"0":"")+mo+"-"+(m[1].length<2?"0":"")+m[1];
  }
  if(h&&h.id)return tsISO(h.id);
  return f;
}
// El bushel (1/9) NO pesa igual en todos los cultivos:
//   Europeo -> va por PIEZAS: 45 por caja, el peso no importa
//   Morron  -> 25.5 lb  = 11.57 kg
//   Slicer  -> 51 lb    = 23.13 kg   (igual que Plain de tercera)
// produccion.html graba las presentaciones con distinto formato segun el
// cultivo ("20 LBS", "12X1 LB", "11lb"...). Se normaliza antes de buscar.
function nk(p){return String(p||"").toLowerCase().replace(/\s+/g,"").replace(/lbs/g,"lb");}

Object.keys(KG).forEach(function(k){KGN[nk(k)]=KG[k];});
Object.keys(PZ).forEach(function(k){PZN[nk(k)]=PZ[k];});
function esBushel(pres){var p=String(pres||"").toLowerCase().replace(/\s+/g,"");return p.indexOf("1/9")>=0||p.indexOf("bushel")>=0;}
function esPlain(pres){return String(pres||"").toLowerCase().indexOf("plain")>=0;}
function kgPres(pres,cu){
  if(cu==="Slicer"){
    if(PZN[nk(pres)])return null;
    if(esBushel(pres)||esPlain(pres))return 23.13;
  }
  if(cu==="Morron"&&esBushel(pres))return 11.57;
  // En Europeo SIEMPRE mandan las piezas, nunca el peso
  if(cu==="Europeo")return null;
  return KGN[nk(pres)]!==undefined?KGN[nk(pres)]:null;
}
function pzPres(pres,cu){
  if(cu==="Europeo"&&esBushel(pres))return 45;
  return PZN[nk(pres)]||0;
}

function capURL(f,c){return FB+"/rendimientos-captura-v1/"+String(f).replace(/-/g,"")+"/"+c+".json";}
function mergeMax(viejo,nuevo){
  var out=JSON.parse(JSON.stringify(viejo||{}));
  Object.keys(nuevo||{}).forEach(function(ra){
    if(!out[ra])out[ra]={};
    Object.keys(nuevo[ra]).forEach(function(ci){
      if(ci==="malla"){out[ra].malla=out[ra].malla||nuevo[ra].malla;return;}
      if(!out[ra][ci])out[ra][ci]={};
      Object.keys(nuevo[ra][ci]).forEach(function(pr){
        var a2=parseInt(out[ra][ci][pr])||0,b2=parseInt(nuevo[ra][ci][pr])||0;
        out[ra][ci][pr]=Math.max(a2,b2);

// Para el rendimiento solo cuenta lo empacado con FRUTA DEL DIA.
// Se descarta el reproceso y la conversion hecha con fruta de dias anteriores.
function motivoExcl(r,fec){
  var t=String((r&&r.tipo)||"").toLowerCase().replace(/[\s_-]/g,"");
  if(t.indexOf("reproces")>=0)return "reproceso";
  if(t.indexOf("conversion")>=0&&t.indexOf("hoy")<0)return "conversion vieja";
  var fo=(r&&(r.fechaOrigen||r.fechaPalletOrigen||r.fechaOrig))||"";
  if(fo&&fo!==fec)return "pallet de otra fecha";
  return "";
}
function esFrutaDelDia(r,fec){return !motivoExcl(r,fec);}

              var cmap2=CMAP[cu]||{};
              var ci=cmap2[r.calidad]||null;
              if(!ci){var _c=String(r.calidad||"").trim().toLowerCase();
                Object.keys(cmap2).forEach(function(k){if(!ci&&k.toLowerCase()===_c)ci=cmap2[k];});}
              if(!ci)return;
              var ra=(r.rancho||"SinRancho")+((r.tipoProd==="Organico"||r.organico===true)?" ORG":" CV");
              // el mismo pallet puede estar en inventario y en bajados partido:
              // se toma el mayor de los dos para no perder ni duplicar
              var prev=vistos[r.id];
              var cj=parseInt(r.cajas)||0;
              if(!prev||cj>prev.cajas)vistos[r.id]={ra:ra,ci:ci,pres:r.presentacion||"",cajas:cj,malla:r.malla||""};
            });
          });
          mapas[cu]=vistos;
          Object.keys(vistos).forEach(function(k){totV+=vistos[k].cajas;});
        });
        var hh=new Date();
        setVigMsg("Ultima revision "+("0"+hh.getHours()).slice(-2)+":"+("0"+hh.getMinutes()).slice(-2)+":"+("0"+hh.getSeconds()).slice(-2)+
          " - "+totV.toLocaleString()+" cajas del dia (incluye lo ya embarcado)");
        setPrdLive(function(){return JSON.parse(JSON.stringify(mapas));});
        setPrd(function(pAnt){
          var n2=JSON.parse(JSON.stringify(pAnt||{}));var cambio=false;
          CULTS.forEach(function(cu){
            var m=mapas[cu];
            if(!m||!Object.keys(m).length)return;
            var acum={};
            Object.keys(m).forEach(function(id){
              var x=m[id];
              if(!acum[x.ra])acum[x.ra]={malla:x.malla||""};
              if(!acum[x.ra][x.ci])acum[x.ra][x.ci]={};
              acum[x.ra][x.ci][x.pres]=(parseInt(acum[x.ra][x.ci][x.pres])||0)+x.cajas;
            });
            if(JSON.stringify(acum)===JSON.stringify(n2[cu]||{}))return;
            n2[cu]=acum;cambio=true;
            fetch(capURL(fecha,cu),{method:"PUT",headers:{"Content-Type":"application/json"},
              body:JSON.stringify(acum)}).catch(function(){});
          });
          return cambio?n2:pAnt;
        });
      }).catch(function(){});
    }
    vigilar();
    var t=setInterval(vigilar,20000);
    return function(){vivo=false;clearInterval(t);};
  },[auth,fecha]);

  var calcs=uM(function(){
    var recC=rec[cult]||{},prdC=prd[cult]||{},rset={};

    var res={};

      var rv=recC[rancho]||{},pv=prdC[rancho]||{};
      var rejas=ni(rv.rejas)||0,pr=nf(gi(rancho,"pesoReja"))||0,pzr=nf(gi(rancho,"piezasReja"))||0;
      var kgRec=r2(rejas*pr),pzRec=Math.round(rejas*pzr),pp=pzRec>0?kgRec/pzRec:0;
      var det={},tot=0,totPz=0,sinPeso=[],faltaPz=[];
      var esEuro=(cult==="Europeo");
      cals.forEach(function(cal){
        var pa=pv[cal.id]||{},kgC=0,pzC=0,dsg={};
        Object.keys(pa).forEach(function(pres){var cajas=ni(pa[pres]),kgP=0,pzP=0;var kc=kgPres(pres,cult),pzc=pzPres(pres,cult);if(cult==="Slicer"&&pzc){pzP=cajas*pzc;kgP=pzP*KG_PZ_SLICER}else if(kc!==null){kgP=cajas*kc}else if(pzc){pzP=cajas*pzc;kgP=pzP*pp;if(!esEuro&&cajas>0&&pp<=0&&faltaPz.indexOf(pres)<0)faltaPz.push(pres)}else if(cajas>0&&sinPeso.indexOf(pres)<0){sinPeso.push(pres)}kgC+=kgP;pzC+=pzP;if(cajas>0)dsg[pres]={cajas:cajas,kg:r2(kgP),pz:pzP}});
        det[cal.id]={kg:r2(kgC),pz:pzC,dsg:dsg};tot+=kgC;totPz+=pzC;
      });
      tot=r2(tot);
      // El Europeo se mide en PIEZAS, no en kilos
      var bRec=esEuro?pzRec:kgRec;
      var bEmp=esEuro?totPz:tot;
      var bM=r2(bRec-bEmp);
      res[rancho]={malla:rv.malla||pv.malla||"",rejas:rejas,pesoReja:pr,
        kgRec:bRec,kgEmp:bEmp,kgM:bM,pctM:pc(bM,bRec),
        u:esEuro?"pzas":"kg",esEuro:esEuro,
        sinPeso:sinPeso,faltaPz:faltaPz,
        fRend:bRec>0?Math.round(bEmp/bRec*1000)/10:0,det:det};
    });
    return res;
  },[rec,prd,inp,cult,fecha]);

    return keys.map(function(dk){var d=hist[dk];if(!d||!d[cult])return null;return{fec:(d[cult].fecha||dk.slice(0,4)+"-"+dk.slice(4,6)+"-"+dk.slice(6,8)),ranchos:d[cult].ranchos||{}}}).filter(Boolean);
  },[hist,cult]);

  var INP={background:"rgba(255,255,255,.06)",border:"1px solid rgba(255,255,255,.1)",borderRadius:6,padding:"5px 8px",color:"#e0ead0",fontSize:13,fontFamily:"'DM Mono',monospace",textAlign:"center",outline:"none"};

  function Btn(p){return <button onClick={p.onClick} disabled={p.dis} style={{background:p.bg||"rgba(255,255,255,.07)",border:"1px solid "+(p.bc||"rgba(255,255,255,.12)"),borderRadius:8,padding:"8px 14px",color:p.col||"#e0ead0",fontWeight:700,fontSize:12,cursor:p.dis?"not-allowed":"pointer",opacity:p.dis?.5:1,transition:"all .15s"}}>{p.children}</button>}

                              <td style={TD({fontWeight:900,fontSize:15,fontFamily:"'DM Mono',monospace",color:"#ef4444"})}>{d.kgM}</td>
                              <td style={TD({fontWeight:700,fontSize:13,color:mCol(d.pctM)})}>{d.pctM}%</td>

                    <div style={{fontSize:9,color:"#4a8a5a",fontWeight:700,letterSpacing:2,textTransform:"uppercase"}}>Parras Valley Tomatoes</div>
                    <div style={{fontSize:14,fontWeight:900,color:"#a8e063",marginTop:1}}>Comparativa de Ranchos</div>

                    {activos.slice().sort(function(a,b){return calcs[b].fRend-calcs[a].fRend}).map(function(rancho,ri){
                      var d=calcs[rancho],rc=RC[ri%RC.length];

                        var _dd=d.det[cal.id]||{};

                      });
                      var mermaV=base>0?r2(base-lin.reduce(function(t,x){return t+x.v},0)):0;
                      var alerta=(d.sinPeso&&d.sinPeso.length)||(d.faltaPz&&d.faltaPz.length);
                      return(
                        <div key={rancho} style={{marginBottom:14,background:"rgba(255,255,255,.025)",border:"1px solid rgba(255,255,255,.07)",borderRadius:10,padding:"12px 14px"}}>
                          <div style={{display:"flex",alignItems:"baseline",gap:10,marginBottom:9,flexWrap:"wrap"}}>
                            <div style={{fontSize:14,fontWeight:900,color:rc,letterSpacing:.3}}>{rancho}</div>
                            <div style={{fontSize:10,color:"#4a6a3a"}}>{d.rejas} rejas{d.malla?" . malla "+d.malla:""}</div>
                            <div style={{marginLeft:"auto",fontSize:11,color:"#7a9a6a"}}>
                              Llegaron <b style={{color:"#a8e063",fontSize:15,fontFamily:"'DM Mono',monospace"}}>{Math.round(base).toLocaleString()}</b> {u}
                            </div>
                          </div>
                          {base<=0
                            ? <div style={{fontSize:11,color:"#fbbf24"}}>Falta capturar el peso por reja de este rancho.</div>
                            : <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                                <thead><tr style={{fontSize:9,color:"#4a7a1e",textAlign:"left"}}>
                                  <th style={{padding:"4px 6px"}}>CALIDAD</th>
                                  <th style={{textAlign:"right"}}>{u.toUpperCase()}</th>
                                  <th style={{textAlign:"right"}}>%</th>
                                  <th style={{textAlign:"right"}}>FACTOR</th>
                                </tr></thead>
                                <tbody>
                                  {lin.map(function(x,i){
                                    var pc2=Math.round(x.v/base*1000)/10;
                                    var fac=Math.round(x.v/base*1000)/1000;
                                    return(
                                      <tr key={i} style={{borderTop:"1px solid rgba(255,255,255,.06)"}}>
                                        <td style={{padding:"5px 6px",color:x.c,fontWeight:800}}>{x.l}</td>
                                        <td style={{textAlign:"right",fontFamily:"'DM Mono',monospace",color:"#e5e7eb",fontWeight:800}}>{Math.round(x.v).toLocaleString()}</td>
                                        <td style={{textAlign:"right",fontFamily:"'DM Mono',monospace",color:"#9ab88a"}}>{pc2}%</td>
                                        <td style={{textAlign:"right",fontFamily:"'DM Mono',monospace",color:x.c,fontWeight:900}}>F{x.f==="a"?"1":x.f==="b"?"2":"3"} {fac.toFixed(3)}</td>
                                      </tr>
                                    );
                                  })}
                                  <tr style={{borderTop:"2px solid rgba(239,68,68,.3)"}}>
                                    <td style={{padding:"5px 6px",color:"#ef4444",fontWeight:800}}>Merma</td>
                                    <td style={{textAlign:"right",fontFamily:"'DM Mono',monospace",color:"#ef4444",fontWeight:800}}>{Math.round(mermaV).toLocaleString()}</td>
                                    <td style={{textAlign:"right",fontFamily:"'DM Mono',monospace",color:mCol(base>0?mermaV/base*100:0)}}>{base>0?Math.round(mermaV/base*1000)/10:0}%</td>
                                    <td style={{textAlign:"right",fontFamily:"'DM Mono',monospace",color:"#6b7280"}}>-</td>
                                  </tr>
                                  <tr style={{borderTop:"1px solid rgba(255,255,255,.12)"}}>
                                    <td style={{padding:"5px 6px",color:"#a8e063",fontWeight:900}}>Empacado</td>
                                    <td style={{textAlign:"right",fontFamily:"'DM Mono',monospace",color:"#a8e063",fontWeight:900}}>{Math.round(d.kgEmp).toLocaleString()}</td>
                                    <td style={{textAlign:"right",fontFamily:"'DM Mono',monospace",color:"#a8e063",fontWeight:900}}>{d.fRend}%</td>
                                    <td style={{textAlign:"right",fontFamily:"'DM Mono',monospace",color:"#a8e063",fontWeight:900}}>{base>0?(Math.round(d.kgEmp/base*1000)/1000).toFixed(3):"-"}</td>
                                  </tr>
                                </tbody>
                              </table>}
                          {alerta&&(
                            <div style={{marginTop:8,background:"rgba(239,68,68,.08)",border:"1px solid rgba(239,68,68,.3)",borderRadius:7,padding:"7px 10px",fontSize:10,color:"#fca5a5",lineHeight:1.5}}>
                              {d.sinPeso&&d.sinPeso.length>0&&<div><b>Sin peso configurado:</b> {d.sinPeso.join(", ")}. Esos kilos entran como cero.</div>}
                              {d.faltaPz&&d.faltaPz.length>0&&<div>Falta piezas por reja para: {d.faltaPz.join(", ")}.</div>}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                  <div style={{padding:"5px 9px",display:"flex",gap:7,flexWrap:"wrap",borderTop:"1px solid rgba(255,255,255,.06)",background:"rgba(0,0,0,.3)"}}>
                    {cals.map(function(cal){return <span key={cal.id} style={{display:"flex",alignItems:"center",gap:3,fontSize:8,color:cal.c,fontWeight:700}}><span style={{width:6,height:6,borderRadius:1,background:cal.c,display:"inline-block"}}/>{cal.l}</span>})}
                    <span style={{display:"flex",alignItems:"center",gap:3,fontSize:8,color:"#ef4444",fontWeight:700}}><span style={{width:6,height:6,borderRadius:1,background:"#ef4444",display:"inline-block"}}/>Merma</span>
                    <span style={{fontSize:8,color:"#3a4a2a",marginLeft:"auto"}}>F=cajas 20lb/reja</span>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      )}

      {/* ===== TAB EVOLUCIÓN ===== */}
      {tab==="evo"&&(
        <div style={{padding:"11px 11px 40px"}}>
          {diasH.length===0&&<div style={{textAlign:"center",padding:"40px 0",color:"#2a3a2a",fontSize:13}}>Sin historial. Guarda los rendimientos desde Captura.</div>}
          {diasH.length>0&&(
            <div>
              <div style={{fontSize:9,color:"#4a6a3a",fontWeight:700,letterSpacing:2,textTransform:"uppercase",marginBottom:11}}>{cult} · últimos {diasH.length} días</div>
              {(function(){
                var rH=[];diasH.forEach(function(d){Object.keys(d.ranchos||{}).forEach(function(r){if(rH.indexOf(r)<0)rH.push(r)})});
                return rH.map(function(rancho,ri){
                  var rc=RC[ri%RC.length];
                  var datos=diasH.map(function(d){var rd=d.ranchos[rancho];if(!rd)return null;return{fec:d.fec.slice(5),pctM:rd.pctM||0}}).filter(Boolean).reverse();
                  if(!datos.length)return null;
                  var W=300,H=80,PAD=10;
                  var maxM=Math.max.apply(null,datos.map(function(x){return x.pctM}))||1;
                  var minM=Math.max(0,Math.min.apply(null,datos.map(function(x){return x.pctM}))-5);
                  var rng=Math.max(maxM-minM,5);
                  var xSt=datos.length>1?(W-PAD*2)/(datos.length-1):W-PAD*2;
                  var yP=function(v){return PAD+(1-(v-minM)/rng)*(H-PAD*2)};
                  var pts=datos.map(function(x,i){return[(PAD+i*xSt).toFixed(1),yP(x.pctM).toFixed(1)]});
                  var poly=pts.map(function(p){return p[0]+","+p[1]}).join(" ");
                  var area="M "+pts[0][0]+","+(H-2)+" L "+poly+" L "+pts[pts.length-1][0]+","+(H-2)+" Z";
                  var last=datos[datos.length-1],prev=datos.length>1?datos[datos.length-2]:null;
                  return(
                    <div key={rancho} style={{background:"rgba(255,255,255,.02)",border:"1px solid "+rc+"33",borderLeft:"3px solid "+rc,borderRadius:8,padding:"10px",marginBottom:8}}>
                      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                        <span style={{fontSize:12,fontWeight:800,color:rc}}>{rancho}</span>
                        <span style={{fontSize:9,color:"#3a5a3a"}}>merma % · {datos.length} días</span>
                        <div style={{flex:1}}/>
                        <span style={{fontSize:12,color:mCol(last.pctM),fontWeight:700,fontFamily:"'DM Mono',monospace"}}>Hoy: {last.pctM}%</span>
                        {prev&&<span style={{fontSize:10,fontWeight:700,padding:"2px 6px",borderRadius:4,background:last.pctM<prev.pctM?"rgba(74,222,128,.1)":"rgba(239,68,68,.1)",color:last.pctM<prev.pctM?"#4ade80":"#ef4444"}}>{last.pctM<prev.pctM?"▼":"▲"} {Math.abs(last.pctM-prev.pctM).toFixed(1)}%</span>}
                      </div>
                      <svg width="100%" viewBox={"0 0 "+W+" "+H} style={{overflow:"visible"}}>
                        <defs><linearGradient id={"g"+ri} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={rc} stopOpacity=".15"/><stop offset="100%" stopColor={rc} stopOpacity=".02"/></linearGradient></defs>
                        <path d={area} fill={"url(#g"+ri+")"}/>
                        {minM<12&&12<maxM&&<g><line x1={PAD} y1={yP(12)} x2={W-PAD} y2={yP(12)} stroke="rgba(251,146,60,.35)" strokeWidth="1" strokeDasharray="4,3"/><text x={W-PAD+3} y={yP(12)+3} fontSize="7" fill="rgba(251,146,60,.7)" fontWeight="700">12%</text></g>}
                        <polyline points={poly} fill="none" stroke={rc} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>
                        {pts.map(function(p,i){var col=mCol(datos[i].pctM);return(
                          <g key={i}>
                            <circle cx={p[0]} cy={p[1]} r="5" fill="#07100a" stroke={col} strokeWidth="2"/>
                            <circle cx={p[0]} cy={p[1]} r="2.5" fill={col}/>
                            <text x={p[0]} y={parseFloat(p[1])-8} textAnchor="middle" fontSize="8" fill={col} fontWeight="700">{datos[i].pctM}%</text>
                            <text x={p[0]} y={H+3} textAnchor="middle" fontSize="7" fill="#2a4a2a">{datos[i].fec}</text>
                          </g>
                        )})}
                      </svg>
                    </div>
                  );
                });
              })()}
            </div>
          )}
        </div>
      )}
    </div>
  );
}
ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
