// VIGIA DE VERSION
// GitHub Pages deja el HTML guardado en la cache del navegador, y por eso solo
// en incognito salia el codigo nuevo. Aqui se pide el propio archivo saltandose
// la cache; si el BUILD de alla es otro, se recarga una sola vez.
(function vigilaVersion(){
  if(window.top!==window.self)return;
  var yaRecargo=false;
  function veces(){
    try{return parseInt(sessionStorage.getItem("pv_rl_rend")||"0",10)||0;}catch(e){return 0;}
  }
  function checa(){
    try{
      fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"})
        .then(function(r){return r.text();})
        .then(function(t){
          var m=t.match(/var BUILD="([^"]+)"/);
          if(!m||m[1]===BUILD)return;
          if(yaRecargo||veces()>=2)return;
          yaRecargo=true;
          try{sessionStorage.setItem("pv_rl_rend",String(veces()+1));}catch(e){}
          location.reload();
        }).catch(function(){});
    }catch(e){}
  }
  setTimeout(checa,3000);
  setInterval(checa,300000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden)checa();});
})();
// El letrero de version de abajo a la derecha estaba escrito a mano en el HTML
// y se quedo en v2026-08-08-N para siempre, aunque el archivo si se actualizara.
// Ahora lo pinta la version real, la misma que compara el vigia.
(function(){
  function pinta(){var e=document.getElementById("verTag");if(e)e.textContent=BUILD;}
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",pinta);
  else pinta();
})();
</script>

function recISO(h){

function nk(p){return String(p||"").toLowerCase().replace(/\s+/g,"").replace(/lbs/g,"lb");}

function kgPres(pres,cu){
  if(cu==="Slicer"){
    if(PZN[nk(pres)])return null;
    if(esBushel(pres)||esPlain(pres))return 23.13;
  }
  if(cu==="Morron"&&esBushel(pres))return 11.57;
  // En Europeo SIEMPRE mandan las piezas, nunca el peso
  if(cu==="Europeo")return null;
  return KGN[nk(pres)]!==undefined?KGN[nk(pres)]:null;
}
function pzPres(pres,cu){
  if(cu==="Europeo"&&esBushel(pres))return 45;

// Caja de referencia para el factor: los kilos de cada calidad se convierten
// a esta presentacion y se dividen entre las rejas cortadas.
// Factor = cajas equivalentes / rejas. Si empacaste mas cajas que rejas, pasa de 1.
// SLICER: todo se mide en CAJAS DE 36 CT, que es lo mismo que la de 25 LBS.
//   36 CT = 25 LBS = 1      (base)
//   18 CT = 0.5             (la mitad de las piezas)
//   42 CT = 1.17 , 62 CT = 1.72   (piezas entre 36)
//   50 LBS = 1/9 = 2        (72 piezas, el doble)
function cj36(pres){
  var p=nk(pres);
  var mct=p.match(/(\d{2})ct/);          // 18ct, 36ct, 42ct, 62ct... aunque traiga texto pegado
  if(mct)return parseInt(mct[1],10)/36;
  if(p==="25lb")return 1;
  if(p==="50lb")return 2;
  if(esBushel(pres)||esPlain(pres))return 2;
  var k=KGN[p];
  if(k!==undefined)return k/11.57;        // cualquier otra caja de peso, contra la de 25 LBS
  return 0;
}

  if(cu==="Europeo") return ci==="c"?{f:45,l:"cj 1/9"}:{f:12,l:"cj 12CT"};
  return {f:0,l:""};
}

                        <div key={rancho} style={{marginBottom:14,background:"rgba(255,255,255,.025)",border:"1px solid rgba(255,255,255,.07)",borderRadius:10,padding:"12px 14px"}}>
                          <div style={{display:"flex",alignItems:"baseline",gap:10,marginBottom:9,flexWrap:"wrap"}}>
                            <div style={{fontSize:14,fontWeight:900,color:rc,letterSpacing:.3}}>{nomLlave(rancho)}</div>
                            {(mallaLlave(rancho)||d.malla)&&<div style={{fontSize:10,fontWeight:800,color:"#0b1a0e",background:rc,borderRadius:4,padding:"1px 7px"}}>MALLA {mallaLlave(rancho)||d.malla}</div>}
                            <div style={{fontSize:10,color:"#4a6a3a"}}>{d.rejas} rejas</div>
                            <div style={{marginLeft:"auto",fontSize:11,color:"#7a9a6a"}}>
                              Llegaron <b style={{color:"#a8e063",fontSize:15,fontFamily:"'DM Mono',monospace"}}>{Math.round(base).toLocaleString()}</b> {u}
                            </div>
                          </div>
                          {base>0&&(function(){
                            var segs=lin.map(function(x){return {l:x.l,c:x.c,v:x.v};});
                            if(mermaV>0)segs.push({l:"Merma",c:"#ef4444",v:mermaV});
                            var tot=segs.reduce(function(t,x){return t+x.v},0)||1;
                            var R=52,C=2*Math.PI*R,off=0;
                            return (
                              <div style={{display:"flex",alignItems:"center",gap:20,margin:"4px 0 14px",flexWrap:"wrap"}}>
                                <svg width="150" height="150" viewBox="0 0 150 150" style={{flex:"none"}}>
                                  <defs>
                                    <filter id={"gl"+ri} x="-50%" y="-50%" width="200%" height="200%">
                                      <feDropShadow dx="0" dy="3" stdDeviation="4" floodColor="#000" floodOpacity="0.55"/>
                                    </filter>
                                    <radialGradient id={"br"+ri} cx="38%" cy="30%">
                                      <stop offset="0%" stopColor="#fff" stopOpacity="0.22"/>
                                      <stop offset="65%" stopColor="#fff" stopOpacity="0"/>
                                    </radialGradient>
                                  </defs>
                                  <circle cx="75" cy="75" r={R} fill="none" stroke="rgba(255,255,255,0.05)" strokeWidth="26"/>
                                  <g filter={"url(#gl"+ri+")"}>
                                    {segs.map(function(x,i){
                                      var dash=C*(x.v/tot);
                                      var el=(<circle key={i} cx="75" cy="75" r={R} fill="none" stroke={x.c}
                                        strokeWidth="26" strokeDasharray={dash+" "+(C-dash)}
                                        strokeDashoffset={-off} transform="rotate(-90 75 75)"/>);
                                      off+=dash;return el;
                                    })}
                                  </g>
                                  <circle cx="75" cy="75" r={R+13} fill={"url(#br"+ri+")"} pointerEvents="none"/>
                                  <circle cx="75" cy="75" r={R-13} fill="#0a1410"/>
                                  <text x="75" y="72" textAnchor="middle" fontSize="24" fontWeight="900"
                                    fill="#a8e063" fontFamily="Georgia,serif">{d.fRend}%</text>
                                  <text x="75" y="88" textAnchor="middle" fontSize="8" fill="#4a6a3a"
                                    letterSpacing="1.5">RENDIMIENTO</text>
                                </svg>
                                <div style={{flex:1,minWidth:150}}>
                                  {segs.map(function(x,i){
                                    var pc3=Math.round(x.v/tot*1000)/10;
                                    return (
                                      <div key={i} style={{marginBottom:7}}>
                                        <div style={{display:"flex",alignItems:"center",gap:7,fontSize:11,marginBottom:3}}>
                                          <span style={{width:9,height:9,borderRadius:3,background:x.c,display:"inline-block",boxShadow:"0 1px 3px rgba(0,0,0,.5)"}}/>
                                          <span style={{color:"#9ab88a",fontWeight:700}}>{x.l}</span>
                                          <span style={{marginLeft:"auto",color:x.c,fontWeight:900,fontFamily:"'DM Mono',monospace"}}>{pc3}%</span>
                                        </div>
                                        <div style={{height:5,borderRadius:3,background:"rgba(255,255,255,.06)",overflow:"hidden"}}>
                                          <div style={{width:pc3+"%",height:"100%",background:x.c,borderRadius:3}}/>
                                        </div>
                                      </div>
                                    );
                                  })}
                                </div>
                              </div>
                            );
                          })()}
                          {base<=0
                            ? <div style={{fontSize:11,color:"#fbbf24"}}>Falta capturar el peso por reja de este rancho.</div>
                            : <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                                <thead><tr style={{fontSize:9,color:"#4a7a1e",textAlign:"left"}}>
                                  <th style={{padding:"4px 6px"}}>CALIDAD</th>
                                  <th style={{textAlign:"right"}}>{u.toUpperCase()}</th>
                                  <th style={{textAlign:"right"}}>%</th>
                                  <th style={{textAlign:"right"}}>CAJAS</th>
                                  <th style={{textAlign:"right"}}>FACTOR</th>
                                </tr></thead>
                                <tbody>
                                  {lin.map(function(x,i){
                                    var pc2=Math.round(x.v/base*1000)/10;
                                    var cr=cajaRef(cult,x.f);
                                    var cjs=cr.f>0?x.v/cr.f:0;
                                    var fac=d.rejas>0?cjs/d.rejas:0;
                                    return(
                                      <tr key={i} style={{borderTop:"1px solid rgba(255,255,255,.06)"}}>
                                        <td style={{padding:"5px 6px",color:x.c,fontWeight:800}}>{x.l}</td>
                                        <td style={{textAlign:"right",fontFamily:"'DM Mono',monospace",color:"#e5e7eb",fontWeight:800}}>{Math.round(x.v).toLocaleString()}</td>
                                        <td style={{textAlign:"right",fontFamily:"'DM Mono',monospace",color:"#9ab88a"}}>{pc2}%</td>
                                        <td style={{textAlign:"right",fontFamily:"'DM Mono',monospace",color:"#cbd5e1"}}>{Math.round(cjs).toLocaleString()}</td>
                                        <td style={{textAlign:"right",fontFamily:"'DM Mono',monospace",color:x.c,fontWeight:900}}>F{x.f==="a"?"1":x.f==="b"?"2":"3"} {fac.toFixed(3)}</td>
                                      </tr>
                                    );
                                  })}
                                  <tr style={{borderTop:"2px solid rgba(239,68,68,.3)"}}>
                                    <td style={{padding:"5px 6px",color:"#ef4444",fontWeight:800}}>Merma</td>
                                    <td style={{textAlign:"right",fontFamily:"'DM Mono',monospace",color:"#ef4444",fontWeight:800}}>{Math.round(mermaV).toLocaleString()}</td>
                                    <td style={{textAlign:"right",fontFamily:"'DM Mono',monospace",color:mCol(base>0?mermaV/base*100:0)}}>{base>0?Math.round(mermaV/base*1000)/10:0}%</td>
                                    <td style={{textAlign:"right",color:"#374151"}}>-</td>
                                    <td style={{textAlign:"right",color:"#374151"}}>-</td>
                                  </tr>
                                  <tr style={{borderTop:"1px solid rgba(255,255,255,.12)"}}>
                                    <td style={{padding:"5px 6px",color:"#a8e063",fontWeight:900}}>Empacado</td>
                                    <td style={{textAlign:"right",fontFamily:"'DM Mono',monospace",color:"#a8e063",fontWeight:900}}>{Math.round(d.kgEmp).toLocaleString()}</td>
                                    <td style={{textAlign:"right",fontFamily:"'DM Mono',monospace",color:"#a8e063",fontWeight:900}}>{d.fRend}%</td>
                                    <td style={{textAlign:"right",fontFamily:"'DM Mono',monospace",color:"#a8e063",fontWeight:900}}>
                                      {(function(){var cr=cajaRef(cult,"a");return cr.f>0?Math.round(d.kgEmp/cr.f).toLocaleString():"-";})()}
                                    </td>
                                    <td style={{textAlign:"right",fontFamily:"'DM Mono',monospace",color:"#a8e063",fontWeight:900}}>
                                      {(function(){var cr=cajaRef(cult,"a");return (d.rejas>0&&cr.f>0)?(d.kgEmp/cr.f/d.rejas).toFixed(3):"-";})()}
                                    </td>
                                  </tr>
                                </tbody>
                              </table>}
                          {alerta&&(
                            <div style={{marginTop:8,background:"rgba(239,68,68,.08)",border:"1px solid rgba(239,68,68,.3)",borderRadius:7,padding:"7px 10px",fontSize:10,color:"#fca5a5",lineHeight:1.5}}>
                              {d.sinPeso&&d.sinPeso.length>0&&<div><b>Sin peso configurado:</b> {d.sinPeso.join(", ")}. Esos kilos entran como cero.</div>}
                              {d.faltaPz&&d.faltaPz.length>0&&<div>Falta piezas por reja para: {d.faltaPz.join(", ")}.</div>}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                  <div style={{padding:"5px 9px",display:"flex",gap:7,flexWrap:"wrap",borderTop:"1px solid rgba(255,255,255,.06)",background:"rgba(0,0,0,.3)"}}>
                    {cals.map(function(cal){return <span key={cal.id} style={{display:"flex",alignItems:"center",gap:3,fontSize:8,color:cal.c,fontWeight:700}}><span style={{width:6,height:6,borderRadius:1,background:cal.c,display:"inline-block"}}/>{cal.l}</span>})}
                    <span style={{display:"flex",alignItems:"center",gap:3,fontSize:8,color:"#ef4444",fontWeight:700}}><span style={{width:6,height:6,borderRadius:1,background:"#ef4444",display:"inline-block"}}/>Merma</span>
                    <span style={{fontSize:8,color:"#3a4a2a",marginLeft:"auto"}}>F=cajas 20lb/reja</span>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      )}

      {/* ===== TAB EVOLUCIÓN ===== */}
      {tab==="evo"&&(
        <div style={{padding:"11px 11px 40px"}}>
          {diasH.length===0&&<div style={{textAlign:"center",padding:"40px 0",color:"#2a3a2a",fontSize:13}}>Sin historial. Guarda los rendimientos desde Captura.</div>}
          {diasH.length>0&&(
            <div>
              <div style={{fontSize:9,color:"#4a6a3a",fontWeight:700,letterSpacing:2,textTransform:"uppercase",marginBottom:11}}>{cult} · últimos {diasH.length} días</div>
              {(function(){
                var rH=[];diasH.forEach(function(d){Object.keys(d.ranchos||{}).forEach(function(r){if(rH.indexOf(r)<0)rH.push(r)})});
                return rH.map(function(rancho,ri){
                  var rc=RC[ri%RC.length];
                  var datos=diasH.map(function(d){var rd=d.ranchos[rancho];if(!rd)return null;return{fec:d.fec.slice(5),pctM:rd.pctM||0}}).filter(Boolean).reverse();
                  if(!datos.length)return null;
                  var W=300,H=80,PAD=10;
                  var maxM=Math.max.apply(null,datos.map(function(x){return x.pctM}))||1;
                  var minM=Math.max(0,Math.min.apply(null,datos.map(function(x){return x.pctM}))-5);
                  var rng=Math.max(maxM-minM,5);
                  var xSt=datos.length>1?(W-PAD*2)/(datos.length-1):W-PAD*2;
                  var yP=function(v){return PAD+(1-(v-minM)/rng)*(H-PAD*2)};
                  var pts=datos.map(function(x,i){return[(PAD+i*xSt).toFixed(1),yP(x.pctM).toFixed(1)]});
                  var poly=pts.map(function(p){return p[0]+","+p[1]}).join(" ");
                  var area="M "+pts[0][0]+","+(H-2)+" L "+poly+" L "+pts[pts.length-1][0]+","+(H-2)+" Z";
                  var last=datos[datos.length-1],prev=datos.length>1?datos[datos.length-2]:null;
                  return(
                    <div key={rancho} style={{background:"rgba(255,255,255,.02)",border:"1px solid "+rc+"33",borderLeft:"3px solid "+rc,borderRadius:8,padding:"10px",marginBottom:8}}>
                      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                        <span style={{fontSize:12,fontWeight:800,color:rc}}>{rancho}</span>
                        <span style={{fontSize:9,color:"#3a5a3a"}}>merma % · {datos.length} días</span>
                        <div style={{flex:1}}/>
                        <span style={{fontSize:12,color:mCol(last.pctM),fontWeight:700,fontFamily:"'DM Mono',monospace"}}>Hoy: {last.pctM}%</span>
                        {prev&&<span style={{fontSize:10,fontWeight:700,padding:"2px 6px",borderRadius:4,background:last.pctM<prev.pctM?"rgba(74,222,128,.1)":"rgba(239,68,68,.1)",color:last.pctM<prev.pctM?"#4ade80":"#ef4444"}}>{last.pctM<prev.pctM?"▼":"▲"} {Math.abs(last.pctM-prev.pctM).toFixed(1)}%</span>}
                      </div>
                      <svg width="100%" viewBox={"0 0 "+W+" "+H} style={{overflow:"visible"}}>
                        <defs><linearGradient id={"g"+ri} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={rc} stopOpacity=".15"/><stop offset="100%" stopColor={rc} stopOpacity=".02"/></linearGradient></defs>
                        <path d={area} fill={"url(#g"+ri+")"}/>
                        {minM<12&&12<maxM&&<g><line x1={PAD} y1={yP(12)} x2={W-PAD} y2={yP(12)} stroke="rgba(251,146,60,.35)" strokeWidth="1" strokeDasharray="4,3"/><text x={W-PAD+3} y={yP(12)+3} fontSize="7" fill="rgba(251,146,60,.7)" fontWeight="700">12%</text></g>}
                        <polyline points={poly} fill="none" stroke={rc} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>
                        {pts.map(function(p,i){var col=mCol(datos[i].pctM);return(
                          <g key={i}>
                            <circle cx={p[0]} cy={p[1]} r="5" fill="#07100a" stroke={col} strokeWidth="2"/>
                            <circle cx={p[0]} cy={p[1]} r="2.5" fill={col}/>
                            <text x={p[0]} y={parseFloat(p[1])-8} textAnchor="middle" fontSize="8" fill={col} fontWeight="700">{datos[i].pctM}%</text>
                            <text x={p[0]} y={H+3} textAnchor="middle" fontSize="7" fill="#2a4a2a">{datos[i].fec}</text>
                          </g>
                        )})}
                      </svg>
                    </div>
                  );
                });
              })()}
            </div>
          )}
        </div>
      )}
    </div>
  );
}
ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
