var BUILD="v2026-09-16-JUNTAS";
// VIGIA DE VERSION
// GitHub Pages deja el HTML guardado en la cache del navegador, y por eso solo
// en incognito salia el codigo nuevo. Aqui se pide el propio archivo saltandose
// la cache; si el BUILD de alla es otro, se recarga una sola vez.
(function vigilaVersion(){
  if(window.top!==window.self)return;
  var yaRecargo=false;
  function veces(){
    try{return parseInt(sessionStorage.getItem("pv_rl_rend")||"0",10)||0;}catch(e){return 0;}
  }
  function checa(){
    try{
      fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"})
        .then(function(r){return r.text();})
        .then(function(t){
          var m=t.match(/var BUILD="([^"]+)"/);
          if(!m||m[1]===BUILD)return;
          if(yaRecargo||veces()>=2)return;
          yaRecargo=true;
          try{sessionStorage.setItem("pv_rl_rend",String(veces()+1));}catch(e){}
          location.reload();
        }).catch(function(){});
    }catch(e){}
  }
  setTimeout(checa,3000);
  setInterval(checa,300000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden)checa();});
})();
// El letrero de version de abajo a la derecha estaba escrito a mano en el HTML
// y se quedo en v2026-08-08-N para siempre, aunque el archivo si se actualizara.
// Ahora lo pinta la version real, la misma que compara el vigia.
(function(){
  function pinta(){var e=document.getElementById("verTag");if(e)e.textContent=BUILD;}
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",pinta);
  else pinta();
})();
</script>

function dosD(n){n=parseInt(n,10);return (n<10?"0":"")+n;}

// y, si el cierre se guardo de madrugada, la fruta caia en el dia siguiente.
// Eso era lo que metia la malla del corte de hoy en el dia de ayer.
function leeFechaTexto(f){
  var s=String(f||"").toLowerCase().replace(/[.,]/g," ");
  var m=s.match(/(\d{4})\s*[-\/]\s*(\d{1,2})\s*[-\/]\s*(\d{1,2})/);       // 2026-09-13
  if(m)return m[1]+"-"+dosD(m[2])+"-"+dosD(m[3]);
  m=s.match(/(\d{1,2})\s*[-\/]\s*(\d{1,2})\s*[-\/]\s*(\d{4})/);            // 13/09/2026
  if(m)return m[3]+"-"+dosD(m[2])+"-"+dosD(m[1]);
  s=s.replace(/\bde\b/g," ").replace(/\bdel\b/g," ");                      // quita "de"/"del"
  m=s.match(/(\d{1,2})\s+([a-zñáéíóú]+)\s+(\d{4})/);                       // 13 septiembre 2026
  if(m&&MES3[m[2].slice(0,3)])return m[3]+"-"+dosD(MES3[m[2].slice(0,3)])+"-"+dosD(m[1]);
  m=s.match(/([a-zñáéíóú]+)\s+(\d{1,2})\s+(\d{4})/);                       // septiembre 13 2026
  if(m&&MES3[m[1].slice(0,3)])return m[3]+"-"+dosD(MES3[m[1].slice(0,3)])+"-"+dosD(m[2]);
  return "";
}

function tsISOcorte(ts){
  var d=new Date(ts),madrugada=(d.getHours()<6);
  if(madrugada)d=new Date(d.getTime()-6*3600000);
  return {iso:d.getFullYear()+"-"+dosD(d.getMonth()+1)+"-"+dosD(d.getDate()),madrugada:madrugada};
}
// Igual que recISO pero dice COMO saco la fecha: del texto o del respaldo por hora.
function recISOv(h){
  var f=(h&&h.fecha)||"";

  if(iso)return {iso:iso,via:"fecha escrita"};
  if(h&&h.id){

      ?"RESPALDO: se cerro de madrugada, se cuenta del dia anterior"

}

  if(cu==="Slicer"){

// Caja de referencia para el factor: los kilos de cada calidad se convierten
// a esta presentacion y se dividen entre las rejas cortadas.
// Factor = cajas equivalentes / rejas. Si empacaste mas cajas que rejas, pasa de 1.
// SLICER: todo se mide en CAJAS DE 36 CT, que es lo mismo que la de 25 LBS.
//   36 CT = 25 LBS = 1      (base)
//   18 CT = 0.5             (la mitad de las piezas)
//   42 CT = 1.17 , 62 CT = 1.72   (piezas entre 36)
//   50 LBS = 1/9 = 2        (72 piezas, el doble)
function cj36(pres){
  var p=nk(pres);
  var mct=p.match(/(\d{2})ct/);          // 18ct, 36ct, 42ct, 62ct... aunque traiga texto pegado
  if(mct)return parseInt(mct[1],10)/36;
  if(p==="25lb")return 1;
  if(p==="50lb")return 2;
  if(esBushel(pres)||esPlain(pres))return 2;
  var k=KGN[p];
  if(k!==undefined)return k/11.57;        // cualquier otra caja de peso, contra la de 25 LBS
  return 0;
}

}

  // vuelo. Media mal el alto y la foto salia cortada por abajo: faltaba el
  // desglose y las graficas. Ahora se hace una COPIA del reporte fuera de la
  // pantalla, a 1400 px y con todo abierto, se MIDE de verdad, y recien
  // entonces se toma la foto con ese alto exacto. Asi no se corta nada.
  function armarLienzo(){
    var el=document.getElementById("reporte");
    if(!el){fl("Primero jala recibo y produccion");return null;}
    if(!window.html2canvas){fl("No cargo el generador de imagen, revisa la senal");return null;}
    var ANCHO=1100;
    var jaula=document.createElement("div");
    jaula.setAttribute("data-nofoto","1");
    jaula.style.cssText="position:absolute;left:-30000px;top:0;width:"+ANCHO+"px;"+
      "background:#07100a;padding:16px;box-sizing:border-box;";
    var copia=el.cloneNode(true);
    copia.removeAttribute("id");                 // no puede haber dos "reporte"
    copia.style.width="100%";
    copia.style.maxWidth="none";
    // EN LA FOTO VA TODO EN UNA SOLA COLUMNA. En dos columnas la de la
    // izquierda se termina antes y queda medio cuadro en negro: la imagen
    // salia enorme y con la mitad desperdiciada, por eso todo se veia chico.
    copia.style.display="block";
    [].slice.call(copia.children).forEach(function(h){
      if(!h||!h.style)return;
      h.style.width="100%";h.style.maxWidth="none";h.style.minWidth="0";
      h.style.flex="none";h.style.marginBottom="12px";
    });
    // fuera lo que no va en la foto: campos de captura y botones de ajuste
    [].slice.call(copia.querySelectorAll('[data-nofoto="1"]')).forEach(function(n){
      if(n.parentNode)n.parentNode.removeChild(n);
    });
    // se abre todo lo recortado o con barra, y se quitan los limites de ancho
    // que estan pensados para la pantalla del telefono
    var ns=[copia].concat([].slice.call(copia.querySelectorAll("*")));
    ns.forEach(function(n){
      if(!n||!n.style)return;
      var ov=String(n.style.overflow||"");
      if(ov==="hidden"||ov==="auto"||ov==="scroll")n.style.overflow="visible";
      if(n.style.overflowX)n.style.overflowX="visible";
      if(n.style.overflowY)n.style.overflowY="visible";
      if(n.style.maxHeight)n.style.maxHeight="none";
      var mw=String(n.style.maxWidth||"");
      if(mw.indexOf("min(100%")>=0||mw==="100%")n.style.maxWidth="none";
      var mnw=String(n.style.minWidth||"");
      if(mnw.indexOf("min(100%")>=0)n.style.minWidth="0";
    });
    jaula.appendChild(copia);
    document.body.appendChild(jaula);
    function quita(){try{document.body.removeChild(jaula)}catch(e){}}
    // el alto REAL de la copia ya acomodada, no el de la pantalla
    var an=Math.max(jaula.scrollWidth,ANCHO);
    var al=Math.max(jaula.scrollHeight,copia.scrollHeight+32,200);
    function tomar(esc){
      return window.html2canvas(jaula,{
        backgroundColor:"#07100a",
        scale:esc,
        width:an,height:al,
        windowWidth:an,windowHeight:al,
        scrollX:0,scrollY:0,
        x:0,y:0
      });
    }
    // Si sale tan grande que el telefono no la aguanta, se reintenta mas chica
    // en vez de quedarse sin nada.
    var esc=window.innerWidth<900?1.5:2;
    if(al*esc>16000)esc=Math.max(1,16000/al);     // tope de alto que aguantan los telefonos
    return tomar(esc)
      .catch(function(){return tomar(1);})
      .then(function(cv){quita();return cv;},function(e){quita();throw e;});
  }
  // Igual que en la app de inventario: primero te ENSENA la imagen y ahi
  // decides. Empieza en COMPLETA (toda la imagen cabe en la pantalla, aunque
  // se vea chica) para que de un vistazo compruebes que no falta nada abajo.
  // Con GRANDE la ves al ancho de la pantalla y le das scroll para leerla.
  function verImagen(cv,nombre){
    var url=cv.toDataURL("image/png");
    var puede=false;
    try{puede=!!(navigator.share&&navigator.canShare);}catch(e){}
    var ov=document.createElement("div");
    ov.style.cssText="position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.95);"+
      "display:flex;flex-direction:column;font-family:inherit;";
    var barra=document.createElement("div");
    barra.style.cssText="display:flex;gap:7px;align-items:center;flex-wrap:wrap;"+
      "padding:9px 11px;background:#07100a;border-bottom:1px solid rgba(74,222,128,.2);flex:none;";
    function boton(txt,fondo,borde,color){
      var b=document.createElement("button");

      b.style.cssText="background:"+fondo+";border:1px solid "+borde+";border-radius:8px;color:"+color+
        ";font-weight:900;font-size:12px;padding:8px 14px;cursor:pointer;font-family:inherit;";
      return b;
    }
    var bCompartir=boton("COMPARTIR","rgba(37,211,102,.18)","rgba(37,211,102,.6)","#25D366");
    var bZoom=boton("VER GRANDE","rgba(255,255,255,.07)","rgba(255,255,255,.18)","#c0d0a0");
    var bBajar=document.createElement("a");
    bBajar.textContent="DESCARGAR";bBajar.download=nombre;bBajar.href=url;
    bBajar.style.cssText="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);"+
      "border-radius:8px;color:#c0d0a0;font-weight:900;font-size:12px;padding:8px 14px;"+
      "cursor:pointer;text-decoration:none;font-family:inherit;";
    var bCerrar=boton("CERRAR","transparent","rgba(255,255,255,.18)","#7a9a6a");
    if(puede)barra.appendChild(bCompartir);
    barra.appendChild(bZoom);
    barra.appendChild(bBajar);
    var esp=document.createElement("div");esp.style.cssText="flex:1;";
    barra.appendChild(esp);
    barra.appendChild(bCerrar);
    var nota=document.createElement("div");
    nota.style.cssText="padding:6px 11px;font-size:10.5px;color:#7a9a6a;background:#07100a;flex:none;"+
      "border-bottom:1px solid rgba(255,255,255,.06);";
    var caja=document.createElement("div");
    caja.style.cssText="flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;"+
      "align-items:center;-webkit-overflow-scrolling:touch;";
    var img=document.createElement("img");
    img.src=url;img.alt="reporte";
    var fin=document.createElement("div");
    fin.textContent="— FIN DEL REPORTE —";
    fin.style.cssText="flex:none;color:#4a6a3a;font-size:10px;font-weight:900;letter-spacing:2px;"+
      "padding:10px 0 4px;";
    caja.appendChild(img);caja.appendChild(fin);
    ov.appendChild(barra);ov.appendChild(nota);ov.appendChild(caja);
    document.body.appendChild(ov);
    // COMPLETA: cabe entera en la pantalla.  GRANDE: al ancho, con scroll.
    var completa=true;
    function pinta(){
      if(completa){
        img.style.cssText="max-width:100%;max-height:100%;width:auto;height:auto;"+
          "object-fit:contain;display:block;border-radius:5px;flex:none;";
        bZoom.textContent="VER GRANDE";
        nota.textContent="Esta es TODA la imagen que se va a mandar ("+cv.width+" x "+cv.height+
          "). Si se ve chica es normal: al enviarla va en su tamano. Usa VER GRANDE para leerla.";
      }else{
        img.style.cssText="width:100%;max-width:none;height:auto;display:block;border-radius:5px;flex:none;";
        bZoom.textContent="VER COMPLETA";
        nota.textContent="Al ancho de la pantalla. Deslizala hasta abajo, hasta el letrero FIN DEL REPORTE.";
      }
      caja.scrollTop=0;
    }
    pinta();
    bZoom.onclick=function(){completa=!completa;pinta();};
    function cerrar(){try{document.body.removeChild(ov)}catch(e){}}
    bCerrar.onclick=cerrar;
    bCompartir.onclick=function(){
      bCompartir.disabled=true;bCompartir.textContent="ABRIENDO...";
      var vuelve=function(){bCompartir.disabled=false;bCompartir.textContent="COMPARTIR";};
      cv.toBlob(function(bl){
        if(!bl){vuelve();fl("No se pudo preparar la imagen. Usa DESCARGAR.");return;}
        try{
          var arch=new File([bl],nombre,{type:"image/png"});
          // Solo el archivo: con texto incluido hay telefonos que se quedan
          // con el texto y sueltan la imagen.
          var dat={files:[arch],title:"Rendimientos "+cult+" "+fecha};
          if(!navigator.canShare(dat)){vuelve();
            fl("Este telefono no deja compartir la imagen. Usa DESCARGAR.");return;}
          navigator.share(dat).then(vuelve).catch(vuelve);
        }catch(e){vuelve();fl("No se pudo compartir: "+e.message);}
      },"image/png");
    };
  }

  // De donde sale cada reja de LO LLEGADO: lote por lote, con el dia que la app
  // le asigna y por que. Lo que no cuadra se ve de inmediato.
  function verOrigen(){
    setJal("r");
    Promise.all([fget("recibo-inv-v1"),fget("recibo-hist-v1")]).then(function(vs){
      var cn=cult.toLowerCase(),filas=[];
      var lin=(vs[0]&&vs[0][cn])||{};
      aArr(lin.lotes).forEach(function(l){
        if(!l||!l.rancho)return;
        var f=tsISO(l.ts);
        filas.push({de:"Dia abierto en recibo (todavia no lo cierran)",abierto:1,
          rancho:l.rancho,malla:String(l.malla||"").toUpperCase(),
          cajas:ni(l.cajas),dia:f,via:"hora en que se capturo el lote"});
      });
      aArr(vs[1]).forEach(function(h){
        if(String((h&&h.lineaNombre)||"").toLowerCase()!==cn)return;
        var r=recISOv(h);
        var hora=h.id?new Date(h.id).toLocaleString("es-MX",{day:"2-digit",month:"2-digit",
          hour:"2-digit",minute:"2-digit"}):"";
        aArr(h.lotes).forEach(function(l){
          if(!l||!l.rancho)return;
          filas.push({de:"Cierre: \""+(h.fecha||"sin fecha escrita")+"\""+(hora?"  · guardado "+hora:""),
            rancho:l.rancho,malla:String(l.malla||"").toUpperCase(),
            cajas:ni(l.cajas),dia:r.iso,via:r.via});
        });
      });
      // Se juntan los lotes por dia+rancho+malla. Asi ves un renglon por malla,
      // que es como lo piensas tu, y no veinte renglones sueltos.
      var ag={},ord=[];
      filas.forEach(function(f){
        var k=f.dia+"|"+f.rancho+"|"+f.malla+"|"+f.de;
        if(!ag[k]){ag[k]=JSON.parse(JSON.stringify(f));ord.push(k);}
        else ag[k].cajas+=f.cajas;
      });
      var out=ord.map(function(k){return ag[k];});
      out.sort(function(a,b){return (a.dia<b.dia?1:a.dia>b.dia?-1:0);});
      setOrigen(out);setJal("");
    }).catch(function(e){setJal("");fl("No se pudo leer recibo: "+e.message);});
  }
  // El dia abierto de recibo NO sabe de que corte es cada reja: se fecha con la

  function usarPara(f){

  function fl(m){setMsg(m);setTimeout(function(){setMsg("")},5000)}
  function gi(r,k){var c=inp[cult];if(!c)return "";var x=c[r];if(!x)return "";return x[k]||""}
  // OJO: cada malla lleva SU peso (o piezas) por reja. La malla que se queda
  // sin ese dato contaba CERO en lo llegado aunque sus rejas si salieran en el
  // total de rejas: la suma se quedaba corta y no habia forma de notarlo
  // (700 de malla 3 + 820 de malla 6 = 1,520 rejas, pero solo contaba 820).
  // Ahora, al capturarlo en una malla, se copia solo a las que esten vacias.
  function si(r,k,v){
    var copiadas=[];
    if((k==="pesoReja"||k==="piezasReja")&&String(v).trim()!==""&&r!=="_nuevo"){
      Object.keys(rec[cult]||{}).forEach(function(k2){
        if(k2===r||k2==="_nuevo")return;
        if(!(ni((rec[cult][k2]||{}).rejas)>0))return;
        if(String((((inp||{})[cult]||{})[k2]||{})[k]||"").trim()==="")copiadas.push(k2);
      });
    }
    setInp(function(p){
      var n=JSON.parse(JSON.stringify(p));
      if(!n[cult])n[cult]={};
      if(!n[cult][r])n[cult][r]={};
      n[cult][r][k]=v;
      copiadas.forEach(function(k2){
        if(!n[cult][k2])n[cult][k2]={};
        n[cult][k2][k]=v;
      });
      return n;
    });
    if(copiadas.length)fl("Se puso el mismo dato en "+copiadas.length+
      " malla(s) que lo traian vacio. Cambialo si alguna es distinta.");
  }
  // Una misma combinacion rancho+tipo puede traer varias mallas el mismo dia
  // (ayer se corto la 3 y la 6, las dos organicas). Aqui se agregan a mano.
  function addMalla(ra,tipo,m){
    m=String(m||"").trim();
    if(!m)return;
    var k=ranKey(ra,true,cult,m);   // 6A/6B mandan; las demas quedan como organico
    setRec(function(p){var n=JSON.parse(JSON.stringify(p));
      if(!n[cult])n[cult]={};
      // _man marca las mallas que agregaste tu. Al jalar de recibo, estas
      // se respetan y todo lo demas se rehace, para que no quede pegada
      // fruta de otro dia que haya cargado una version anterior.
      if(!n[cult][k])n[cult][k]={rejas:"",malla:m,_man:1};
      else n[cult][k]._man=1;
      return n;});
  }
  function delKey(k){
    // Antes solo borraba de LO LLEGADO. Si la tarjeta venia de produccion o de

    // por eso QUITAR "no quitaba". Ahora se va de los cuatro lados y tambien

    var quita=function(o){var n=JSON.parse(JSON.stringify(o||{}));

      .catch(function(){fl("Se quito de la pantalla, pero no se pudo borrar la copia del servidor.");});

  // El ajuste se ACUMULA: si ya habias puesto +171 y ahora pones -171, queda en

  function sMan(k,cal,pres,v){

  // Rejas a mano, para cuando no se jala de la app de Recibo.
  // Las rejas que TECLEAS tu quedan marcadas como tuyas (_man). Si no, el
  // jalado automatico de cada 5 minutos las borraba: rehace lo llegado desde
  // recibo y lo que no venia de recibo se caia. Pasaba sobre todo con las
  // tarjetas que salen por PRODUCCION cuando recibo no tiene nada de ese dia:
  // capturabas las rejas, se veia bien, y a los minutos quedaba solo lo

  function sRej(rk,v){setRec(function(p){var n=JSON.parse(JSON.stringify(p));

  // El recibo marca el lote como organico. Se separa igual que produccion
// (PVT ORG / PVT CV) para que los dos lados se puedan cruzar.
// REGLAS FIJAS: hay combinaciones que SIEMPRE son organicas aunque en la
// captura las hayan marcado como convencional. Se corrigen aqui.
// Que rancho tiene cada cultivo. Solo se muestran las tarjetas que aplican.
var RANCHO_CULT={
  "PVT":["Persa","Slicer"],
  "Cordillera":["Persa","Slicer","Europeo","Morron","Minibel"],
  "Forrajera":["Persa","Morron","Minibel"]
};
function ranchosDe(cu){
  var out=[];
  Object.keys(RANCHO_CULT).forEach(function(r){
    if(RANCHO_CULT[r].indexOf(cu)>=0)out.push(r);
  });
  return out.length?out:Object.keys(RANCHO_CULT);
}
// Llaves listas para capturar a mano: cada rancho del cultivo en sus dos
// versiones, ORG y CV, ya con el mismo formato que usa produccion. Antes las
// tarjetas salian como "PVT" a secas y no cruzaban con "PVT ORG"/"PVT CV".
// Ya no se pintan tarjetas de relleno. Solo sale lo que de verdad tiene datos,
// y lo nuevo se agrega desde la barra de arriba, por malla.
function ranchosKeys(cu){return [];}
function forzarOrg(rancho,cu){
  var r=String(rancho||"").toLowerCase().replace(/[^a-z]/g,"");
  var esCordillera=(r.indexOf("cord")>=0||r==="crp"||r==="cpr");
  if(esCordillera&&cu==="Slicer")return true;
  return false;
}
// En Europeo el seguimiento es POR MALLA: la llave lleva rancho + tipo + malla.
// En los demas cultivos la llave se queda como estaba.
// El seguimiento es POR MALLA en TODOS los cultivos: la llave lleva
// rancho + tipo + malla, para poder separar cuanto llego y cuanto se
// empaco de cada malla en el mismo dia.
var CULT_MALLA={Persa:true,Slicer:true,Europeo:true,Morron:true,Minibel:true};
// LA MALLA MANDA. Toda malla es ORGANICA menos las que esten en esta lista,
// que son convencionales. Hoy solo la 6B. Si cambia, se agrega aqui.
// REGLA (Miguel, 16 sep 2026): manda lo que traiga RECIBO DE FRUTA.
// La malla solo decide cuando trae lado escrito: 6A es organico y 6B es
// convencional. Una malla sin lado (6 a secas) NO cambia nada: se queda con
// lo que capturaron en recibo. Antes cualquier malla que no fuera "6b" se
// forzaba a organico, y por eso la 6 del corte convencional salia como ORG.
var MALLAS_CV={"6b":1};
var MALLAS_ORG={"6a":1};
function mallaEsCV(m){return !!MALLAS_CV[String(m||"").trim().toLowerCase()];}
function mallaEsORG(m){return !!MALLAS_ORG[String(m||"").trim().toLowerCase()];}
function ranKey(rancho,esOrg,cu,malla){
  var m=String(malla||"").trim().toUpperCase();   // 6b y 6B son la misma malla
  var org;
  if(mallaEsCV(m))org=false;                      // 6B: convencional siempre
  else if(mallaEsORG(m))org=true;                 // 6A: organico siempre
  else org=(esOrg||forzarOrg(rancho,cu));         // lo demas: como lo tenga recibo
  var base=(rancho||"SinRancho")+(org?" ORG":" CV");
  if(CULT_MALLA[cu]&&m)base+=" M"+m;
  return base;
}
// Parte la llave en sus tres pedazos
function partesLlave(k){
  var m=String(k).match(/^(.*)\s(ORG|CV)(?:\sM(.*))?$/);
  if(!m)return {rancho:k,tipo:"",malla:""};
  return {rancho:m[1],tipo:m[2],malla:m[3]||""};
}
function ranTipo(l,cu){
  var org=(l&&(l.organico===true||l.organico==="si"||l.organico==="Si"||
    String(l.tipoProd||"").toLowerCase().indexOf("org")>=0||
    String(l.tipo||"").toLowerCase().indexOf("org")>=0));

function jRec(){

      var cn=cult.toLowerCase(),res={};
      // UNA MALLA = UNA TARJETA.
      // Antes cada lote se clasificaba por su cuenta, asi que si en recibo
      // capturaron unos lotes de la misma malla como organico y otros como
      // convencional, la malla se partia en dos tarjetas y cada una traia un
      // pedazo de las rejas (por eso la malla 6 salia con 49 en vez de 849:
      // las otras 800 estaban en la tarjeta de al lado).
      // Ahora se juntan primero por RANCHO + MALLA, se suman las rejas de cada
      // tipo, y el tipo de la malla lo decide el que traiga MAS rejas en
      // recibo. 6A y 6B siguen mandando sobre todo lo demas.
      var pre={};
      function juntar(l){
        var ra=l.rancho||"SinRancho";
        var m=String(l.malla||"").trim().toUpperCase();
        var k=ra+"|"+m;
        if(!pre[k])pre[k]={rancho:ra,malla:l.malla||"",org:0,cv:0};
        var esOrg=!!(l.organico===true||l.organico==="si"||l.organico==="Si"||
          String(l.tipoProd||"").toLowerCase().indexOf("org")>=0||
          String(l.tipo||"").toLowerCase().indexOf("org")>=0);
        if(esOrg)pre[k].org+=ni(l.cajas); else pre[k].cv+=ni(l.cajas);
        if(l.malla)pre[k].malla=l.malla;
      }
      var inv=vs[0];
      if(inv&&typeof inv==="object"){var lin=inv[cn]||{};var lts=lin.lotes||[];if(!Array.isArray(lts))lts=Object.values(lts).filter(Boolean);lts.forEach(function(l){if(!l||!l.rancho||tsISO(l.ts)!==fecha)return;if(ni(l.cajas)<=0)return;juntar(l);})}
      var hc=vs[1];
      if(hc){var arr=Array.isArray(hc)?hc:Object.values(hc).filter(Boolean);arr.forEach(function(h){if(!h||(h.lineaNombre||"").toLowerCase()!==cn)return;if(recISO(h)!==fecha)return;var lts2=h.lotes||[];if(!Array.isArray(lts2))lts2=Object.values(lts2).filter(Boolean);lts2.forEach(function(l){if(!l||!l.rancho)return;if(ni(l.cajas)<=0)return;juntar(l);})})}
      var mezcladas=[];
      Object.keys(pre).forEach(function(k){
        var x=pre[k],tot=x.org+x.cv;
        if(tot<=0)return;
        if(x.org>0&&x.cv>0)mezcladas.push((x.malla||"sin malla")+" ("+
          x.org.toLocaleString()+" org y "+x.cv.toLocaleString()+" cv)");
        var rk=ranKey(x.rancho,x.org>=x.cv,cult,x.malla);
        if(!res[rk])res[rk]={rejas:0,malla:""};
        res[rk].rejas+=tot;
        if(x.malla)res[rk].malla=x.malla;
      });
      // Recibo es la verdad de LO LLEGADO: trae el dia completo, no un pedazo.
      // Antes solo se encimaban las llaves nuevas y las viejas se quedaban
      // pegadas para siempre: por eso seguia saliendo la malla del corte de
      // hoy en el dia de ayer aunque ya estuviera corregida la fecha.
      // Ahora el bloque se rehace desde cero. Solo se respetan las mallas que
      // agregaste a mano (_man). Se limpia solo, sin que tengas que borrar nada.
      var leyo=!!(vs[0]&&typeof vs[0]==="object")||!!(vs[1]&&typeof vs[1]==="object");
      var quitadas=0;
      setRec(function(p){
        var n=JSON.parse(JSON.stringify(p));
        var prev=n[cult]||{};
        if(!leyo){   // no se pudo leer recibo: no se toca lo que ya hay
          Object.keys(res).forEach(function(k){prev[k]=res[k]});
          n[cult]=prev;return n;
        }
        var nuevo={};
        Object.keys(prev).forEach(function(k){
          if(prev[k]&&prev[k]._man)nuevo[k]=prev[k];      // tuya, se queda
          else if(!res[k])quitadas++;                      // era de otro dia
        });
        Object.keys(res).forEach(function(k){if(!nuevo[k])nuevo[k]=res[k];});
        // Una malla sin rejas no es un corte: no se pinta. Antes salia la
        // tarjeta vacia de una malla que ni se corto ese dia.
        Object.keys(nuevo).forEach(function(k){
          if(nuevo[k]&&!nuevo[k]._man&&ni(nuevo[k].rejas)<=0)delete nuevo[k];
        });
        n[cult]=nuevo;return n;
      });
      var nR=Object.keys(res).length;
      setEst(function(p){return Object.assign({},p,{
        rec:!leyo?"sin conexion":(nR>0?("OK · "+nR+" rancho(s)"):"sin captura"),recN:nR,t:Date.now()})});
      setJal("");
      var totRej=0;Object.keys(res).forEach(function(k){totRej+=ni(res[k].rejas);});
      setAvisoRec({f:fecha,cult:cult,n:nR,rejas:totRej,sinSenal:!leyo,quitadas:quitadas,
        mezcladas:mezcladas});
      setTimeout(function(){
        if(!leyo){fl("No se pudo leer recibo (sin senal). No se toco nada de lo que ya tenias.");return;}
        fl(nR>0
          ?("✓ Recibo: "+Object.keys(res).join(", ")+" · "+fecha+
             (quitadas?"  ·  se quitaron "+quitadas+" que no eran de este dia":""))
          :("Sin recibo para "+cult+" el "+fecha+
             (quitadas?" · se quitaron "+quitadas+" que no eran de este dia":"")));
      },0);
    }).catch(function(){setJal("");setEst(function(p){return Object.assign({},p,{rec:"sin conexion"})});
      setAvisoRec({f:fecha,cult:cult,n:0,rejas:0,sinSenal:1,quitadas:0});
      fl("Error recibo")});
  }

var VER_FIX="2026-09-15-fechas";
function capURL(f,c){return FB+"/rendimientos-captura-v1/"+String(f).replace(/-/g,"")+"/"+c+".json";}
function mergeMax(viejo,nuevo){
  var out=JSON.parse(JSON.stringify(viejo||{}));
  Object.keys(nuevo||{}).forEach(function(ra){
    if(!out[ra])out[ra]={};
    Object.keys(nuevo[ra]).forEach(function(ci){
      if(ci==="malla"){out[ra].malla=out[ra].malla||nuevo[ra].malla;return;}
      if(!out[ra][ci])out[ra][ci]={};
      Object.keys(nuevo[ra][ci]).forEach(function(pr){
        var a2=parseInt(out[ra][ci][pr])||0,b2=parseInt(nuevo[ra][ci][pr])||0;
        out[ra][ci][pr]=Math.max(a2,b2);
      });
    });
  });
  return out;
}

  // Corrige llaves ya guardadas con el tipo equivocado (ej. "Cordillera CV"

                    <div style={{background:"rgba(74,222,128,.06)",border:"1px solid rgba(74,222,128,.2)",

                      {ms.length===0
                        ? <div>
                            <div style={{fontSize:12,color:"#fca5a5",fontWeight:800,marginBottom:5}}>
                              Recibo no tiene nada cerrado para el {fecha}.
                            </div>
                            <div style={{fontSize:11,color:"#c0d0a0",lineHeight:1.6}}>

                              <b style={{color:"#fde047"}}> dia abierto</b>, porque en recibo todavia no lo cierran),
                              aprietale a <b style={{color:"#4ade80"}}>USAR PARA EL {fecha}</b> y se pasan solas,

                            </div>
                          </div>
                        : <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
                            {ms.map(function(m){return (
                              <div key={m} style={{background:"rgba(0,0,0,.3)",border:"1px solid rgba(74,222,128,.2)",

                                <div style={{fontSize:9,color:"#4a6a3a"}}>rejas</div>
                              </div>
                            )})}
                            <div style={{background:"rgba(74,222,128,.14)",border:"1px solid rgba(74,222,128,.4)",

                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>

                        <th style={{textAlign:"left",padding:"5px 6px"}}>Malla</th>
                        <th style={{textAlign:"left",padding:"5px 6px"}}>Rancho</th>
                        <th style={{textAlign:"right",padding:"5px 6px"}}>Rejas</th>
                        <th style={{textAlign:"left",padding:"5px 6px"}}>De donde</th>
                        <th style={{textAlign:"left",padding:"5px 6px"}}>Como se le puso la fecha</th>
                        <th style={{textAlign:"right",padding:"5px 6px"}}>Mandarlo al {fecha}</th>
                      </tr>
                    </thead>
                    <tbody>
                      {origen.length===0&&(
                        <tr><td colSpan={7} style={{padding:"11px 6px",color:"#fca5a5",fontWeight:700}}>
                          Recibo no tiene ningun lote de {cult}. Capturalo a mano con AGREGAR.
                        </td></tr>
                      )}
                      {origen.map(function(f,i){
                        var mio=(f.dia===fecha);
                        var ojo=(f.via.indexOf("RESPALDO")===0);
                        return (
                          <tr key={i} style={{borderTop:"1px solid rgba(255,255,255,.05)",
                            background:mio?"rgba(74,222,128,.07)":"transparent",opacity:mio?1:.55}}>
                            <td style={{padding:"5px 6px",fontWeight:800,color:mio?"#4ade80":"#7a9a6a"}}>{f.dia||"?"}</td>
                            <td style={{padding:"5px 6px",fontWeight:800,color:"#e0ead0"}}>{f.malla||"—"}</td>
                            <td style={{padding:"5px 6px",color:"#c0d0a0"}}>{f.rancho}</td>
                            <td style={{padding:"5px 6px",textAlign:"right",fontWeight:900,color:"#e0ead0"}}>{f.cajas}</td>
                            <td style={{padding:"5px 6px",color:"#7a9a6a"}}>{f.de}</td>
                            <td style={{padding:"5px 6px",color:ojo?"#fca5a5":"#7a9a6a",fontWeight:ojo?800:400}}>{f.via}</td>
                            <td style={{padding:"5px 6px",textAlign:"right"}}>
                              {mio
                                ? <span style={{fontSize:9,color:"#4ade80",fontWeight:800}}>YA ESTA</span>
                                : <button onClick={function(){usarPara(f)}}
                                    style={{background:"rgba(74,222,128,.14)",border:"1px solid rgba(74,222,128,.45)",
                                      borderRadius:6,color:"#4ade80",fontWeight:900,fontSize:9.5,letterSpacing:.4,
                                      padding:"4px 9px",cursor:"pointer",whiteSpace:"nowrap",fontFamily:"inherit"}}>
                                    USAR PARA EL {fecha}
                                  </button>}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
                <div style={{fontSize:10,color:"#7a9a6a",marginTop:10,lineHeight:1.5}}>
                  Las lineas en <b style={{color:"#fca5a5"}}>rojo</b> de la ultima columna son las que no traian
                  fecha escrita: la app tuvo que usar la hora en que se guardo el cierre, y por eso pueden caer
                  en el dia equivocado. El <b>dia abierto</b> se fecha con la hora en que capturaste el lote,
                  no con el dia del corte.
                </div>
              </div>
            </div>
          )}

          {/* VEREDICTO DE RECIBO — en grande y hasta arriba.
              Antes solo habia un puntito de color y no se sabia si jalo o no. */}
          {!!avisoRec&&avisoRec.f===fecha&&avisoRec.cult===cult&&(function(){
            var a=avisoRec;
            if(a.buscando)return (
              <div style={{background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.1)",
                borderRadius:9,padding:"10px 13px",marginBottom:11,fontSize:12,color:"#7a9a6a",fontWeight:700}}>
                Buscando lo del {fecha} en recibo de fruta...
              </div>
            );
            if(a.sinSenal)return (
              <div style={{background:"rgba(239,68,68,.1)",border:"1px solid rgba(239,68,68,.4)",
                borderRadius:9,padding:"10px 13px",marginBottom:11,fontSize:12.5,color:"#fca5a5",fontWeight:800}}>

              </div>

            if(a.n>0)return (
              <div style={{background:"rgba(74,222,128,.08)",border:"1px solid rgba(74,222,128,.28)",
                borderRadius:9,padding:"10px 13px",marginBottom:11,fontSize:12.5,color:"#4ade80",fontWeight:800}}>
                Recibo de fruta trajo {a.n} malla(s) del {fecha}
                {a.rejas?" · "+a.rejas.toLocaleString()+" rejas":""}
                {a.quitadas?<span style={{color:"#fbbf24",fontWeight:700}}>{"  ·  se quitaron "+a.quitadas+" que no eran de este dia"}</span>:null}
                {a.mezcladas&&a.mezcladas.length>0&&(
                  <div style={{marginTop:6,fontSize:11,color:"#fbbf24",fontWeight:700,lineHeight:1.6}}>
                    En recibo capturaron la misma malla de las dos formas, organico y convencional.
                    La app la junta en una sola tarjeta y le pone el tipo que traiga mas rejas:
                    <div style={{color:"#fde68a",fontWeight:800}}>{"malla "+a.mezcladas.join(" · malla ")}</div>

            return (
              <div style={{background:"rgba(251,191,36,.12)",border:"1px solid rgba(251,191,36,.5)",
                borderRadius:9,padding:"12px 13px",marginBottom:11}}>
                <div style={{fontSize:13,color:"#fbbf24",fontWeight:900,marginBottom:4}}>
                  Recibo de fruta NO tiene nada de {cult} del {fecha}.
                </div>
                <div style={{fontSize:11.5,color:"#d0c090",lineHeight:1.6,marginBottom:9}}>
                  Puede ser que todavia no cierren el dia alla. Registralo tu a mano, o revisa si las
                  rejas estan en el dia abierto y mandalas a esta fecha con un clic.
                </div>
                <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
                  <button onClick={function(){
                      var e=document.getElementById("campoMalla");
                      if(e){try{e.scrollIntoView({block:"center",behavior:"smooth"})}catch(x){}
                        setTimeout(function(){try{e.focus()}catch(x){}},250);}
                    }}
                    style={{background:"rgba(74,222,128,.16)",border:"1px solid rgba(74,222,128,.5)",
                      borderRadius:7,color:"#4ade80",fontWeight:900,fontSize:11.5,padding:"7px 14px",
                      cursor:"pointer",fontFamily:"inherit"}}>REGISTRAR A MANO</button>
                  <button onClick={verOrigen} disabled={!!jal}
                    style={{background:"rgba(234,179,8,.1)",border:"1px solid rgba(234,179,8,.45)",
                      borderRadius:7,color:"#fde047",fontWeight:900,fontSize:11.5,padding:"7px 14px",
                      cursor:jal?"not-allowed":"pointer",opacity:jal?.5:1,fontFamily:"inherit"}}>
                    VER QUE HAY EN RECIBO</button>
                </div>
              </div>
            );
          })()}

          {/* Calidades que produccion graba y la app no sabe clasificar */}
          {!!calsRaras&&calsRaras.f===fecha&&calsRaras.cult===cult&&(
            <div style={{background:"rgba(251,191,36,.12)",border:"1px solid rgba(251,191,36,.5)",
              borderRadius:9,padding:"11px 13px",marginBottom:11}}>
              <div style={{fontSize:13,color:"#fbbf24",fontWeight:900,marginBottom:5}}>
                Produccion trae calidades que no se pudieron clasificar.
              </div>
              <div style={{fontSize:11.5,color:"#d0c090",lineHeight:1.7,marginBottom:5}}>
                Esas cajas NO entraron al rendimiento. Revisa como las estan capturando alla:
              </div>
              {Object.keys(calsRaras.cals).map(function(c,i){
                return (
                  <div key={i} style={{fontSize:12,color:"#fde68a",fontWeight:800,padding:"2px 0"}}>
                    · "{c}" — {calsRaras.cals[c].toLocaleString()} cajas fuera
                  </div>
                );
              })}
            </div>
          )}

          {/* Mallas que NO estan contando por falta del dato por reja */}
          {mallasMudas.length>0&&(
            <div style={{background:"rgba(239,68,68,.12)",border:"1px solid rgba(239,68,68,.5)",
              borderRadius:9,padding:"11px 13px",marginBottom:11}}>
              <div style={{fontSize:13,color:"#fca5a5",fontWeight:900,marginBottom:5}}>
                Cuidado: {mallasMudas.length} malla(s) NO estan contando en lo llegado.
              </div>
              <div style={{fontSize:11.5,color:"#e0b0b0",lineHeight:1.7,marginBottom:4}}>
                Sus rejas si aparecen en el total, pero sin el dato por reja valen cero y la suma
                te sale corta. Llena el campo que falta en cada tarjeta:
              </div>
              {mallasMudas.map(function(m,i){
                return (
                  <div key={i} style={{fontSize:12,color:"#fecaca",fontWeight:800,padding:"2px 0"}}>
                    · Malla {m.malla||"(sin malla)"} — {m.rejas.toLocaleString()} rejas — falta <b>{m.pide}</b>
                  </div>
                );
              })}
            </div>
          )}

          {/* Estado del jalado automatico */}
          {(function(){
            function pinta(t,v,n){
              var ok=(v||"").indexOf("OK")===0;
              var vacio=(v==="sin captura");
              var col=ok?"#4ade80":(vacio?"#f59e0b":(v?"#ef4444":"#4a6a3a"));
              return (
                <div style={{display:"flex",alignItems:"center",gap:6,minWidth:172}}>
                  <span style={{width:9,height:9,borderRadius:9,background:col,flex:"none",
                    boxShadow:"0 0 7px "+col}}/>
                  <span style={{fontSize:10,color:"#7a9a6a",fontWeight:700,letterSpacing:.5,
                    textTransform:"uppercase"}}>{t}</span>
                  <span style={{fontSize:11,color:col,fontWeight:800}}>
                    {v?(vacio?"sin captura — va manual":v):"esperando..."}
                  </span>
                </div>
              );
            }
            var h=est.t?new Date(est.t):null;
            return (
              <div style={{background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.08)",
                borderRadius:9,padding:"8px 12px",marginBottom:9,display:"flex",gap:16,
                alignItems:"center",flexWrap:"wrap"}}>
                <button onClick={function(){setAutoJala(!autoJala)}}
                  style={{display:"flex",alignItems:"center",gap:6,background:"none",border:"none",
                    cursor:"pointer",padding:0}}>
                  <span style={{width:32,height:17,borderRadius:17,flex:"none",position:"relative",
                    background:autoJala?"rgba(74,222,128,.35)":"rgba(255,255,255,.12)",
                    border:"1px solid "+(autoJala?"rgba(74,222,128,.6)":"rgba(255,255,255,.18)")}}>
                    <span style={{position:"absolute",top:2,left:autoJala?16:2,width:11,height:11,
                      borderRadius:11,background:autoJala?"#4ade80":"#6a7a5a"}}/>
                  </span>
                  <span style={{fontSize:9,fontWeight:900,letterSpacing:1.6,textTransform:"uppercase",
                    color:autoJala?"#4ade80":"#6a7a5a"}}>{autoJala?"Al dia solo":"Automatico en pausa"}</span>
                </button>
                {pinta("Recibo",est.rec)}
                {pinta("Produccion",est.prd)}
                <div style={{flex:1}}/>
                <span style={{fontSize:10,color:"#4a6a3a"}}>
                  {h?("actualizado "+String(h.getHours()).padStart(2,"0")+":"+String(h.getMinutes()).padStart(2,"0")):(autoOn?"jalando...":"")}
                </span>
                <button onClick={function(){setAutoJala(true);jalaTodo(true,true);}} disabled={!!jal}
                  style={{background:"rgba(74,222,128,.1)",border:"1px solid rgba(74,222,128,.3)",
                    borderRadius:7,color:"#4ade80",fontWeight:800,fontSize:11,padding:"5px 11px",
                    cursor:jal?"not-allowed":"pointer",opacity:jal?.5:1}}>Actualizar ahora</button>
              </div>
            );
          })()}

          <div style={{display:"flex",gap:7,marginBottom:11,flexWrap:"wrap",alignItems:"center"}}>
            <Btn onClick={jRec} dis={!!jal} bg="rgba(234,179,8,.08)" bc="rgba(234,179,8,.25)" col="#fde047">{jal==="r"?"Jalando recibo...":"⬇ Jalar de Recibo"}</Btn>
            <Btn onClick={function(){setPrdFecha(fecha);setShowPrdModal(true);}} dis={!!jal} bg="rgba(56,189,248,.08)" bc="rgba(56,189,248,.25)" col="#38bdf8">{jal==="p"?"Jalando produccion...":"⬇ Jalar de Produccion"}</Btn>
            <div style={{flex:1}}/>
            <Btn onClick={verOrigen} dis={!!jal} bg="rgba(234,179,8,.08)" bc="rgba(234,179,8,.3)" col="#fde047">De donde viene lo llegado</Btn>
            <Btn onClick={limpiarDia} bg="rgba(239,68,68,.08)" bc="rgba(239,68,68,.3)" col="#fca5a5">Limpiar este dia</Btn>
            {hayD&&<Btn onClick={compartirReporte} bg="rgba(37,211,102,.12)" bc="rgba(37,211,102,.45)" col="#25D366">Compartir reporte</Btn>}
            {hayD&&<Btn onClick={guardar} dis={grd} bg="rgba(74,222,128,.1)" bc="rgba(74,222,128,.3)" col="#4ade80">{grd?"Guardando...":" Guardar día"}</Btn>}
          </div>

          <div style={{background:"rgba(255,255,255,.02)",border:"1px solid rgba(255,255,255,.06)",borderRadius:8,padding:"9px 11px",marginBottom:11}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8,flexWrap:"wrap"}}>
              <div style={{fontSize:9,color:"#4a6a3a",fontWeight:700,letterSpacing:1.5,textTransform:"uppercase"}}>Recibo por malla</div>
              <div style={{flex:1}}/>
              {(function(){
                var ra=gi("_nuevo","rancho")||ranchosDe(cult)[0];
                var ml=gi("_nuevo","malla")||"";
                function agregar(){
                  if(!ml.trim())return;
                  addMalla(ra,"ORG",ml);
                  si("_nuevo","malla","");
                }
                var SS=Object.assign({},INP,{padding:"3px 6px",fontSize:11});
                return (
                  <div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap"}}>
                    <span style={{fontSize:9,color:"#4a6a3a",fontWeight:700}}>AGREGAR</span>
                    <select value={ra} onChange={function(e){si("_nuevo","rancho",e.target.value)}}
                      style={Object.assign({},SS,{width:108})}>
                      {ranchosDe(cult).map(function(r){return <option key={r} value={r}>{r}</option>})}
                    </select>
                    <input type="text" placeholder="malla" value={ml} id="campoMalla"
                      onChange={function(e){si("_nuevo","malla",e.target.value)}}
                      onKeyDown={function(e){if(e.key==="Enter")agregar()}}
                      style={Object.assign({},SS,{width:58})}/>
                    <button onClick={agregar}
                      style={{background:"rgba(74,222,128,.14)",border:"1px solid rgba(74,222,128,.4)",
                        borderRadius:5,color:"#4ade80",fontWeight:900,fontSize:10,letterSpacing:.5,
                        padding:"3px 10px",cursor:"pointer"}}>AGREGAR</button>
                    <span style={{fontSize:9,color:"#4a6a3a"}}>
                      {ml.trim()
                        ?(mallaEsCV(ml)?"sera CONVENCIONAL":(mallaEsORG(ml)?"sera ORGANICA":"toma el tipo de recibo"))
                        :"6A organico, 6B convencional; las demas como las tenga recibo"}
                    </span>
                  </div>
                );
              })()}
            </div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              {(function(){
                var ks={};
                Object.keys(rec[cult]||{}).forEach(function(k){ks[k]=1;});
                Object.keys(prd[cult]||{}).forEach(function(k){if(k!=="malla")ks[k]=1;});
                ranchosKeys(cult).forEach(function(k){ks[k]=1;});
                var arr=Object.keys(ks);
                return arr.sort();
              })().map(function(rancho,ri){
                var rv=(rec[cult]||{})[rancho]||{};var rc=RC[ri%RC.length];

                  <div key={rancho} style={{background:"rgba(255,255,255,.03)",border:"1px solid "+rc+"33",borderLeft:"3px solid "+rc,borderRadius:7,padding:"8px 10px",minWidth:165}}>
                    <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:5,flexWrap:"wrap"}}><span style={{fontWeight:800,color:rc,fontSize:12}}>{nomLlave(rancho)}</span>{mallaLlave(rancho)&&<span style={{fontSize:9,fontWeight:900,color:"#07100a",background:rc,borderRadius:4,padding:"1px 5px"}}>MALLA {mallaLlave(rancho)}</span>}</div>
                    <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                      <div><div style={{fontSize:8,color:"#4a6a3a",marginBottom:2}}>Rejas</div><input type="number" min="0" placeholder="0" value={rv.rejas===0?"":(rv.rejas||"")} onChange={function(e){sRej(rancho,e.target.value)}} style={Object.assign({},INP,{width:65,fontWeight:900})}/></div>
                      <div><div style={{fontSize:8,color:"#4a6a3a",marginBottom:2}}>Kg/reja</div><input type="number" min="0" step="0.1" placeholder="0.0" value={gi(rancho,"pesoReja")} onChange={function(e){si(rancho,"pesoReja",e.target.value)}} style={Object.assign({},INP,{width:65})}/></div>
                      {(cult==="Slicer"||cult==="Europeo"||cult==="Morron")&&<div><div style={{fontSize:8,color:"#4a6a3a",marginBottom:2}}>Pzas/reja</div><input type="number" min="0" placeholder="0" value={gi(rancho,"piezasReja")} onChange={function(e){si(rancho,"piezasReja",e.target.value)}} style={Object.assign({},INP,{width:65})}/></div>}
                    </div>
                    {(function(){
                      var pk=partesLlave(rancho);
                      if(!pk.tipo)return null;
                      var nm=gi(rancho,"nuevaMalla");
                      return (
                        <div data-nofoto="1" style={{display:"flex",gap:5,alignItems:"center",marginTop:7,
                          paddingTop:6,borderTop:"1px solid rgba(255,255,255,.07)"}}>
                          <span style={{fontSize:8,color:"#4a6a3a",fontWeight:700,
                            letterSpacing:.6,textTransform:"uppercase"}}>Otra malla</span>
                          <input type="text" inputMode="numeric" placeholder="3" value={nm}
                            onChange={function(e){si(rancho,"nuevaMalla",e.target.value)}}
                            onKeyDown={function(e){if(e.key==="Enter"){addMalla(pk.rancho,pk.tipo,nm);si(rancho,"nuevaMalla","");}}}
                            style={Object.assign({},INP,{width:42,padding:"3px 5px",fontSize:12})}/>
                          <button onClick={function(){addMalla(pk.rancho,pk.tipo,nm);si(rancho,"nuevaMalla","");}}
                            style={{background:"rgba(74,222,128,.14)",border:"1px solid rgba(74,222,128,.4)",
                              borderRadius:5,color:"#4ade80",fontWeight:900,fontSize:10,letterSpacing:.5,
                              padding:"3px 9px",cursor:"pointer",lineHeight:1.3}}>AGREGAR</button>
                          <div style={{flex:1}}/>
                          {pk.malla&&!ni(rv.rejas)&&(
                            <button onClick={function(){delKey(rancho)}} title="Quitar esta malla"
                              style={{background:"rgba(239,68,68,.12)",border:"1px solid rgba(239,68,68,.35)",
                                borderRadius:5,color:"#ef4444",fontWeight:900,fontSize:11,
                                padding:"2px 8px",cursor:"pointer",lineHeight:1.4}}>quitar</button>
                          )}
                        </div>
                      );
                    })()}
                  </div>
                );
              })}
            </div>
          </div>

          {!hayD&&(
            <div style={{textAlign:"center",padding:"28px 12px",color:"#4a6a3a",fontSize:13,lineHeight:1.7}}>
              <div style={{fontWeight:800,color:"#7a9a6a",marginBottom:6}}>
                No hay nada de {cult} en el {fecha}.
              </div>
              <div style={{fontSize:11.5,maxWidth:470,margin:"0 auto 13px"}}>
                Puede que en recibo todavia no cierren el dia. Abre
                <b style={{color:"#fde047"}}> De donde viene lo llegado</b> y ahi le mandas las rejas
                a esta fecha con un clic, o capturalas a mano arriba con AGREGAR.
              </div>
              <Btn onClick={verOrigen} dis={!!jal} bg="rgba(234,179,8,.1)" bc="rgba(234,179,8,.4)" col="#fde047">
                Ver de donde viene lo llegado
              </Btn>
            </div>
          )}

          {hayD&&(
            <div id="reporte" style={{display:"flex",gap:12,alignItems:"flex-start",flexWrap:"wrap"}}>

              {/* IZQUIERDA — captura y detalle por presentacion (12CT, 24CT, 1/9...).
                  Va marcado data-nofoto: se ve en pantalla, donde lo necesitas para
                  capturar y ajustar, pero NO sale en la imagen que se comparte. Al
                  grupo se manda solo el reporte de la derecha, que es el concreto. */}
              <div data-nofoto="1" style={{flex:"1 1 420px",minWidth:"min(100%,380px)",maxWidth:620}}>
                {activos.map(function(rancho,ri){

                        {(function(){var ps=[];cals.forEach(function(cal){var pr=prR[cal.id]||{};Object.keys(pr).forEach(function(p){if(ni(pr[p])>0)ps.push(cal.l.split(" ")[0]+" "+p+"("+pr[p]+")")})});if(!ps.length)return null;return <div data-nofoto="1" style={{fontSize:9,color:"#4a5a3a",marginBottom:4,padding:"2px 4px",background:"rgba(255,255,255,.03)",borderRadius:3}}>Encontrado: {ps.join(" · ")}</div>})()}

                        <table style={{width:"100%",borderCollapse:"collapse"}}>

                  <div style={{background:"rgba(0,0,0,.5)",padding:"9px 12px",borderBottom:"1px solid rgba(74,222,128,.15)"}}>

                  </div>
                  {VigBox()}
                  {/* El letrero rojo de diagnostico se quito a peticion del usuario.

                  {activos.length>0&&(function(){

                  {/* ===== DESGLOSE POR MALLA =====

                       la tarjeta de abajo ya es el reporte de esa malla y

                  {resumen.mallas.filter(function(m){return resumen.g[m].ranchos.length>1}).length>0&&(function(){

                  {CULT_MALLA[cult]&&(function(){

                          {base>0&&(function(){
                            var segs=lin.map(function(x){return {l:x.l,c:x.c,v:x.v};});

                            var tot=segs.reduce(function(t,x){return t+x.v},0)||1;
                            var R=52,C=2*Math.PI*R,off=0;
                            return (
                              <div style={{display:"flex",alignItems:"center",gap:20,margin:"4px 0 14px",flexWrap:"wrap"}}>

                                <div style={{flex:1,minWidth:150}}>
                                  {segs.map(function(x,i){
                                    var pc3=Math.round(x.v/tot*1000)/10;
                                    return (
                                      <div key={i} style={{marginBottom:7}}>
                                        <div style={{display:"flex",alignItems:"center",gap:7,fontSize:11,marginBottom:3}}>
                                          <span style={{width:9,height:9,borderRadius:3,background:x.c,display:"inline-block",boxShadow:"0 1px 3px rgba(0,0,0,.5)"}}/>
                                          <span style={{color:"#9ab88a",fontWeight:700}}>{x.l}</span>
                                          <span style={{marginLeft:"auto",color:x.c,fontWeight:900,fontFamily:"'DM Mono',monospace"}}>{pc3}%</span>
                                        </div>
                                        <div style={{height:5,borderRadius:3,background:"rgba(255,255,255,.06)",overflow:"hidden"}}>
                                          <div style={{width:pc3+"%",height:"100%",background:x.c,borderRadius:3}}/>
                                        </div>
                                      </div>
                                    );
                                  })}
                                </div>
                              </div>
                            );
                          })()}
                          {base<=0
                            ? <div style={{fontSize:11,color:"#fbbf24"}}>Falta capturar el peso por reja de este rancho.</div>
                            : <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                                <thead><tr style={{fontSize:9,color:"#4a7a1e",textAlign:"left"}}>
                                  <th style={{padding:"4px 6px"}}>CALIDAD</th>
                                  <th style={{textAlign:"right"}}>{u.toUpperCase()}</th>
                                  <th style={{textAlign:"right"}}>%</th>
                                  <th style={{textAlign:"right"}}>CAJAS</th>
                                  <th style={{textAlign:"right"}}>FACTOR</th>
                                </tr></thead>
                                <tbody>
                                  {lin.map(function(x,i){
                                    var pc2=Math.round(x.v/base*1000)/10;
                                    var cr=cajaRef(cult,x.f);
                                    var cjs=cr.f>0?x.v/cr.f:0;
                                    var fac=d.rejas>0?cjs/d.rejas:0;
                                    return(
                                      <tr key={i} style={{borderTop:"1px solid rgba(255,255,255,.06)"}}>
                                        <td style={{padding:"5px 6px",color:x.c,fontWeight:800}}>{x.l}</td>
                                        <td style={{textAlign:"right",fontFamily:"'DM Mono',monospace",color:"#e5e7eb",fontWeight:800}}>{Math.round(x.v).toLocaleString()}</td>
                                        <td style={{textAlign:"right",fontFamily:"'DM Mono',monospace",color:"#9ab88a"}}>{pc2}%</td>
                                        <td style={{textAlign:"right",fontFamily:"'DM Mono',monospace",color:"#cbd5e1"}}>{Math.round(cjs).toLocaleString()}</td>
                                        <td style={{textAlign:"right",fontFamily:"'DM Mono',monospace",color:x.c,fontWeight:900}}>F{x.f==="a"?"1":x.f==="b"?"2":"3"} {fac.toFixed(3)}</td>
                                      </tr>
                                    );
                                  })}
                                  <tr style={{borderTop:"2px solid rgba(239,68,68,.3)"}}>
                                    <td style={{padding:"5px 6px",color:"#ef4444",fontWeight:800}}>Merma</td>
                                    <td style={{textAlign:"right",fontFamily:"'DM Mono',monospace",color:"#ef4444",fontWeight:800}}>{Math.round(mermaV).toLocaleString()}</td>
                                    <td style={{textAlign:"right",fontFamily:"'DM Mono',monospace",color:mCol(base>0?mermaV/base*100:0)}}>{base>0?Math.round(mermaV/base*1000)/10:0}%</td>
                                    <td style={{textAlign:"right",color:"#374151"}}>-</td>
                                    <td style={{textAlign:"right",color:"#374151"}}>-</td>
                                  </tr>
                                  <tr style={{borderTop:"1px solid rgba(255,255,255,.12)"}}>
                                    <td style={{padding:"5px 6px",color:"#a8e063",fontWeight:900}}>Empacado</td>
                                    <td style={{textAlign:"right",fontFamily:"'DM Mono',monospace",color:"#a8e063",fontWeight:900}}>{Math.round(d.kgEmp).toLocaleString()}</td>
                                    <td style={{textAlign:"right",fontFamily:"'DM Mono',monospace",color:"#a8e063",fontWeight:900}}>{d.fRend}%</td>
                                    <td style={{textAlign:"right",fontFamily:"'DM Mono',monospace",color:"#a8e063",fontWeight:900}}>
                                      {(function(){var cr=cajaRef(cult,"a");return cr.f>0?Math.round(d.kgEmp/cr.f).toLocaleString():"-";})()}
                                    </td>
                                    <td style={{textAlign:"right",fontFamily:"'DM Mono',monospace",color:"#a8e063",fontWeight:900}}>
                                      {(function(){var cr=cajaRef(cult,"a");return (d.rejas>0&&cr.f>0)?(d.kgEmp/cr.f/d.rejas).toFixed(3):"-";})()}
                                    </td>
                                  </tr>
                                </tbody>
                              </table>}
                          {alerta&&(
                            <div style={{marginTop:8,background:"rgba(239,68,68,.08)",border:"1px solid rgba(239,68,68,.3)",borderRadius:7,padding:"7px 10px",fontSize:10,color:"#fca5a5",lineHeight:1.5}}>
                              {d.sinPeso&&d.sinPeso.length>0&&<div><b>Sin peso configurado:</b> {d.sinPeso.join(", ")}. Esos kilos entran como cero.</div>}
                              {d.faltaPz&&d.faltaPz.length>0&&<div>Falta piezas por reja para: {d.faltaPz.join(", ")}.</div>}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                  <div style={{padding:"5px 9px",display:"flex",gap:7,flexWrap:"wrap",borderTop:"1px solid rgba(255,255,255,.06)",background:"rgba(0,0,0,.3)"}}>
                    {cals.map(function(cal){return <span key={cal.id} style={{display:"flex",alignItems:"center",gap:3,fontSize:8,color:cal.c,fontWeight:700}}><span style={{width:6,height:6,borderRadius:1,background:cal.c,display:"inline-block"}}/>{cal.l}</span>})}
                    <span style={{display:"flex",alignItems:"center",gap:3,fontSize:8,color:"#ef4444",fontWeight:700}}><span style={{width:6,height:6,borderRadius:1,background:"#ef4444",display:"inline-block"}}/>Merma</span>
                    <span style={{fontSize:8,color:"#3a4a2a",marginLeft:"auto"}}>F=cajas 20lb/reja</span>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      )}

      {/* ===== TAB EVOLUCIÓN ===== */}
      {tab==="evo"&&(
        <div style={{padding:"11px 11px 40px"}}>
          {diasH.length===0&&<div style={{textAlign:"center",padding:"40px 0",color:"#2a3a2a",fontSize:13}}>Sin historial. Guarda los rendimientos desde Captura.</div>}
          {diasH.length>0&&(
            <div>
              <div style={{fontSize:9,color:"#4a6a3a",fontWeight:700,letterSpacing:2,textTransform:"uppercase",marginBottom:11}}>{cult} · últimos {diasH.length} días</div>
              {(function(){
                var rH=[];diasH.forEach(function(d){Object.keys(d.ranchos||{}).forEach(function(r){if(rH.indexOf(r)<0)rH.push(r)})});
                return rH.map(function(rancho,ri){
                  var rc=RC[ri%RC.length];
                  var datos=diasH.map(function(d){var rd=d.ranchos[rancho];if(!rd)return null;return{fec:d.fec.slice(5),pctM:rd.pctM||0}}).filter(Boolean).reverse();
                  if(!datos.length)return null;
                  var W=300,H=80,PAD=10;
                  var maxM=Math.max.apply(null,datos.map(function(x){return x.pctM}))||1;
                  var minM=Math.max(0,Math.min.apply(null,datos.map(function(x){return x.pctM}))-5);
                  var rng=Math.max(maxM-minM,5);
                  var xSt=datos.length>1?(W-PAD*2)/(datos.length-1):W-PAD*2;
                  var yP=function(v){return PAD+(1-(v-minM)/rng)*(H-PAD*2)};
                  var pts=datos.map(function(x,i){return[(PAD+i*xSt).toFixed(1),yP(x.pctM).toFixed(1)]});
                  var poly=pts.map(function(p){return p[0]+","+p[1]}).join(" ");
                  var area="M "+pts[0][0]+","+(H-2)+" L "+poly+" L "+pts[pts.length-1][0]+","+(H-2)+" Z";
                  var last=datos[datos.length-1],prev=datos.length>1?datos[datos.length-2]:null;
                  return(
                    <div key={rancho} style={{background:"rgba(255,255,255,.02)",border:"1px solid "+rc+"33",borderLeft:"3px solid "+rc,borderRadius:8,padding:"10px",marginBottom:8}}>
                      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                        <span style={{fontSize:12,fontWeight:800,color:rc}}>{rancho}</span>
                        <span style={{fontSize:9,color:"#3a5a3a"}}>merma % · {datos.length} días</span>
                        <div style={{flex:1}}/>
                        <span style={{fontSize:12,color:mCol(last.pctM),fontWeight:700,fontFamily:"'DM Mono',monospace"}}>Hoy: {last.pctM}%</span>
                        {prev&&<span style={{fontSize:10,fontWeight:700,padding:"2px 6px",borderRadius:4,background:last.pctM<prev.pctM?"rgba(74,222,128,.1)":"rgba(239,68,68,.1)",color:last.pctM<prev.pctM?"#4ade80":"#ef4444"}}>{last.pctM<prev.pctM?"▼":"▲"} {Math.abs(last.pctM-prev.pctM).toFixed(1)}%</span>}
                      </div>
                      <svg width="100%" viewBox={"0 0 "+W+" "+H} style={{overflow:"visible"}}>
                        <defs><linearGradient id={"g"+ri} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={rc} stopOpacity=".15"/><stop offset="100%" stopColor={rc} stopOpacity=".02"/></linearGradient></defs>
                        <path d={area} fill={"url(#g"+ri+")"}/>
                        {minM<12&&12<maxM&&<g><line x1={PAD} y1={yP(12)} x2={W-PAD} y2={yP(12)} stroke="rgba(251,146,60,.35)" strokeWidth="1" strokeDasharray="4,3"/><text x={W-PAD+3} y={yP(12)+3} fontSize="7" fill="rgba(251,146,60,.7)" fontWeight="700">12%</text></g>}
                        <polyline points={poly} fill="none" stroke={rc} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>
                        {pts.map(function(p,i){var col=mCol(datos[i].pctM);return(
                          <g key={i}>
                            <circle cx={p[0]} cy={p[1]} r="5" fill="#07100a" stroke={col} strokeWidth="2"/>
                            <circle cx={p[0]} cy={p[1]} r="2.5" fill={col}/>
                            <text x={p[0]} y={parseFloat(p[1])-8} textAnchor="middle" fontSize="8" fill={col} fontWeight="700">{datos[i].pctM}%</text>
                            <text x={p[0]} y={H+3} textAnchor="middle" fontSize="7" fill="#2a4a2a">{datos[i].fec}</text>
                          </g>
                        )})}
                      </svg>
                    </div>
                  );
                });
              })()}
            </div>
          )}
        </div>
      )}
    </div>
  );
}
ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
